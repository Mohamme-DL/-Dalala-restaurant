<style>

html[data-theme=light][data-a=emerald]{--glow:#c8f5e1}html[data-theme=light][data-a=violet]{--glow:#e0d6ff}html[data-theme=light][data-a=rose]{--glow:#ffd6dd}html[data-theme=light][data-a=amber]{--glow:#ffeab8}html[data-theme=light][data-a=teal]{--glow:#c4f3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(1200px 600px at 80% -10%,var(--glow) 0,transparent 60%),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:var(--fs);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;transition:transform .08s,filter .15s,background .15s}
button:active{transform:scale(.96)}
input,textarea{font:inherit;color:var(--tx);background:var(--inp);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;width:100%;outline:0;transition:border .15s,box-shadow .15s}

#app{height:100%;display:flex;flex-direction:column;max-width:1500px;margin:0 auto}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(180deg,var(--bar1),var(--bar2));border-bottom:1px solid var(--line);box-shadow:0 4px 14px #0005;position:relative;z-index:5}
.bar h1{font-size:1.2em;margin:0;flex:1;font-weight:800;letter-spacing:.2px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 4px #fb718522}.dot.on{background:var(--ok);box-shadow:0 0 0 4px #22c55e22}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-weight:700;min-height:48px}
.btn:hover{filter:brightness(1.12)}
.btn.pri{background:linear-gradient(180deg,var(--pri),var(--pri2));border-color:transparent;color:var(--onpri)}
.btn.ok{background:linear-gradient(180deg,var(--ok),var(--ok2));border-color:transparent;color:#fff;font-size:1.06em;min-height:54px;box-shadow:0 6px 16px #16a34a44}

.tbl.busy{border-color:#fbbf2466;background:linear-gradient(180deg,var(--busy1),var(--busy2))}.tbl.busy:before{background:var(--warn)}.tbl.busy small{color:var(--busyt)}

.modal>div{background:linear-gradient(180deg,var(--mod1),var(--mod2));border:1px solid var(--line);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px;max-height:88%;overflow:auto}

/* الهاتف: القائمة بكامل الشاشة وشريط سلة سفلي يُفتح بالضغط */

.split{flex-direction:column;position:relative}

.cats{padding:10px 12px}
.cart{position:fixed;inset-inline:0;bottom:0;z-index:30;width:auto;max-width:none;border-inline-start:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px #0008;max-height:82%}
.ctog{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px 10px;background:none;border:0;color:var(--tx);font:inherit;font-weight:800}
.ctog:before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:44px;height:4px;border-radius:4px;background:var(--line)}
.cart{position:fixed}
.ctog .ci{min-width:28px;height:28px;border-radius:99px;background:linear-gradient(180deg,var(--pri),var(--pri2));color:var(--onpri);display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:.9em}
.ctog .ct{flex:1;text-align:start}.ctog .cs{color:var(--price)}.ctog .cc{color:var(--mut);font-size:1.1em}
.cart .list{display:none;overflow:auto;padding:4px 12px;max-height:46vh}
.cart.open .list{display:block}
.cart:not(.open) #onote,.cart:not(.open) .tot{display:none}

.foot input{padding:9px 12px}.foot .btn{min-height:46px;padding:8px 12px}.foot .btn.ok{min-height:50px}
.line{padding:8px 10px;margin-bottom:6px}.bar{padding:10px 12px}.btn{padding:10px 14px}
}
@media(max-width:699px) and (max-height:520px){.split{flex-direction:row}.cart{position:static;width:42%;max-height:none;border-radius:0;border-top:0;border-inline-start:1px solid var(--line);box-shadow:none}.ctog{display:none}.cart .list{display:block;max-height:none}.cart:not(.open) #onote,.cart:not(.open) .tot{display:flex}.prods{padding-bottom:18px}}
/* تابلت عمودي */
@media(min-width:700px) and (max-width:999px){.cart{width:330px;max-width:40%}.prods{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}.prod{min-height:112px}}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}.sw.on{border-color:var(--tx)}.icb{min-height:44px;min-width:44px;padding:8px 12px;font-size:1.15em}

<body>
<div id="app"></div>
<script>
'use strict';
/* تطبيق النادل — يعمل على الهاتف/الآيباد من متصفح الجهاز، ويتصل بجهاز الكاشير الرئيسي عبر الواي فاي.
   الطلبات تُحفظ في قاعدة بيانات الكاشير وتُطبع تذكرة المطبخ هناك تلقائيًا. */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } }, del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } } };


/* ===== المظهر: فاتح/داكن + لون التمييز ===== */
const ACC = { sky: ['#38bdf8', 'سماوي'], emerald: ['#34d399', 'أخضر'], teal: ['#2dd4bf', 'فيروزي'], violet: ['#a78bfa', 'بنفسجي'], rose: ['#fb7185', 'وردي'], amber: ['#fbbf24', 'ذهبي'] };
function applyTheme() {
  const t = LS.get('w_theme', 'dark'), a = LS.get('w_accent', 'sky'), h = document.documentElement;
  h.dataset.theme = t; if (a === 'sky') delete h.dataset.a; else h.dataset.a = a;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'light' ? '#ffffff' : '#0f172a';
}
function themeModal() {
  const t = LS.get('w_theme', 'dark'), a = LS.get('w_accent', 'sky');
  const m = modal(`<h3 style="margin-top:0">المظهر</h3><div class="row"><button class="btn ${t === 'dark' ? 'pri' : ''}" data-th="dark">🌙 داكن</button><button class="btn ${t === 'light' ? 'pri' : ''}" data-th="light">☀️ فاتح</button></div>
    <p class="mut" style="margin:16px 0 8px">لون التطبيق</p><div class="users" style="justify-content:flex-start;margin:0">${Object.keys(ACC).map(k => `<button class="sw ${a === k ? 'on' : ''}" data-ac="${k}" title="${ACC[k][1]}" style="background:${ACC[k][0]}"></button>`).join('')}</div>
    <p style="margin-top:18px"><button class="btn" id="thx" style="width:100%">إغلاق</button></p>`);
  m.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { LS.set('w_theme', b.dataset.th); applyTheme(); m.remove(); themeModal(); });
  m.querySelectorAll('[data-ac]').forEach(b => b.onclick = () => { LS.set('w_accent', b.dataset.ac); applyTheme(); m.remove(); themeModal(); });
  $('#thx', m).onclick = () => m.remove();
}
function themeBtn() { return '<button class="btn icb" data-theme-btn title="المظهر">🎨</button>'; }
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('[data-theme-btn]')) themeModal(); });
applyTheme();

const W = {
  key: LS.get('w_key', ''), data: LS.get('w_cache', null), version: LS.get('w_ver', 0), user: null,
  queue: LS.get('w_queue', []), online: false, clientId: LS.get('w_cid', null), view: 'boot',
  table: null, cart: [], cat: 'all', q: '', note: '', pinUser: null, pin: '', base: ''
};
if (!W.clientId) { W.clientId = uid(); LS.set('w_cid', W.clientId); }
const S = () => (W.data && W.data.settings) || {};
const dec = () => (S().decimals == null ? 2 : S().decimals);
const money = n => (+n || 0).toFixed(dec()) + ' ' + (S().currency || '');
const round = n => { const f = Math.pow(10, dec()); return Math.round((+n || 0) * f) / f; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- الاتصال ---------- */
async function req(path, { method = 'GET', body, timeout = 8000 } = {}) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), timeout);
  try {
    const res = await fetch(W.base + path, { method, headers: { 'x-dalala-key': W.key, 'x-dalala-client': W.clientId, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal, cache: 'no-store' });
    if (res.status === 401) { const e = new Error('مفتاح الربط غير صحيح'); e.auth = true; throw e; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(tm); }
}
function applyEntries(entries) {
  const d = W.data; let n = 0;
  for (const e of entries) for (const op of e.ops) {
    if (op.obj) {
      if (op.value && typeof op.value === 'object') d[op.obj] = op.value;
      else { const o = d[op.obj] = Object.assign({}, d[op.obj] || {}, op.patch || {}); (op.unset || []).forEach(k => delete o[k]); }
      n++; continue;
    }
    let arr = Array.isArray(d[op.col]) ? d[op.col] : (d[op.col] = []);
    if (op.del && op.del.length) { const ds = new Set(op.del); arr = d[op.col] = arr.filter(r => !ds.has(r.id)); }
    const idx = new Map(arr.map((r, i) => [r.id, i]));
    for (const r of op.put || []) { if (idx.has(r.id)) arr[idx.get(r.id)] = r; else { idx.set(r.id, arr.length); arr.push(r); } }
    n++;
  }
  return n;
}
const saveCache = () => { LS.set('w_cache', W.data); LS.set('w_ver', W.version); };
async function snapshot() {
  const s = await req('/api/snapshot', { timeout: 30000 });
  if (s.data && s.data.settings) { W.data = s.data; W.version = s.version; saveCache(); }
}
async function pull(wait) {
  const r = await req(`/api/changes?since=${W.version}&wait=${wait ? 1 : 0}&name=${encodeURIComponent('نادل ' + (W.user ? W.user.name : ''))}`, { timeout: wait ? 35000 : 10000 });
  W.online = true;
  if (r.reset) { await snapshot(); return true; }
  let ch = false;
  if (r.entries && r.entries.length) { ch = applyEntries(r.entries) > 0; }
  W.version = r.version; saveCache(); return ch;
}
let polling = false;
async function pollLoop() {
  if (polling) return; polling = true;
  for (;;) {
    try { const ch = await pull(true); setDot(); if (ch) rerender(); await flush(); }
    catch (e) { W.online = false; setDot(); if (e.auth) { W.key = ''; LS.del('w_key'); go('key'); polling = false; return; } await sleep(3000); }
  }
}
function setDot() { document.querySelectorAll('.dot').forEach(d => d.classList.toggle('on', W.online)); const q = $('#qn'); if (q) q.textContent = W.queue.length ? W.queue.length + ' بانتظار الإرسال' : ''; }

/* ---------- العمليات (تُحفظ محليًا وتُرسل عند توفر الاتصال) ---------- */
const openOf = tid => ((W.data && W.data.open) || []).find(o => o.tableId === tid && o.type === 'dine');
const tableName = id => { const t = ((W.data && W.data.tables) || []).find(x => x.id === id); return t ? t.name : '-'; };
function dayKey(ms) { const d = new Date(ms), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function nextDailyNo(at) {
  const k = dayKey(at); let m = 0; const d = W.data;
  for (const o of (d.open || []).concat(d.orders || [])) if (o.dailyNo && dayKey(o.openedAt || o.createdAt || o.date || at) === k) m = Math.max(m, +o.dailyNo || 0);
  const dn = S().dailyNo; if (dn && dn.day === k) m = Math.max(m, +dn.n || 0);
  return m + 1;
}
function enqueue(it) { it.iid = it.iid || uid(); it.at = it.at || Date.now(); it.by = W.user ? W.user.name : ''; W.queue.push(it); LS.set('w_queue', W.queue); setDot(); flush(); }
let flushing = false;
async function flush() {
  if (flushing || !W.queue.length || !W.key) return; flushing = true;
  try {
    while (W.queue.length) {
      await pull(false);                          // أحدث نسخة قبل الدمج حتى لا يضيع طلب نادل آخر
      const it = W.queue[0]; const ops = build(it);
      if (ops && ops.length) await req('/api/apply', { method: 'POST', body: { ops }, timeout: 30000 });
      W.queue.shift(); LS.set('w_queue', W.queue); await pull(false);
    }
    W.online = true; setDot(); rerender();
  } catch (e) { W.online = false; setDot(); if (!e.auth) setTimeout(flush, 4000); }
  flushing = false;
}
function build(it) {
  const d = W.data;
  if (it.kind === 'send') {
    if ((d.tickets || []).some(t => t.id === it.iid)) return null;          // وصل سابقًا (انقطع الرد فقط)
    let o = openOf(it.tableId); const tItems = [];
    if (!o) o = { id: uid(), type: 'dine', tableId: it.tableId, items: [], discount: { type: 'pct', value: 0 }, customer: { name: '', phone: '', address: '' }, deliveryFee: S().deliveryFee || 0, note: '', createdAt: it.at, dailyNo: nextDailyNo(it.at), userName: it.by };
    else o = clone(o);
    for (const x of it.items) {
      const p = (d.products || []).find(q => q.id === x.pid); if (!p) continue;
      const note = x.note || '';
      const line = o.items.find(l => l.pid === p.id && (l.note || '') === note && l.price === p.price && (l.sent || 0) >= l.qty);
      if (line) { line.qty += x.qty; line.sent = line.qty; }
      else o.items.push({ pid: p.id, name: p.name, price: p.price, cost: p.cost || 0, qty: x.qty, note, sent: x.qty, kitchen: p.kitchen !== false });
      if (p.kitchen !== false) tItems.push({ name: p.name, qty: x.qty, note });
    }
    if (!tItems.length && !it.items.length) return null;
    const ops = [{ col: 'open', put: [o] }];
    if (tItems.length) ops.push({ col: 'tickets', put: [{ id: it.iid, orderId: o.id, label: 'طاولة ' + tableName(it.tableId), type: 'dine', dailyNo: o.dailyNo, items: tItems, note: it.note || '', at: it.at, done: false, user: it.by, src: 'waiter', printed: false }] });
    return ops;
  }
  const o = (d.open || []).find(x => x.id === it.orderId); if (!o) return null;   // دُفع أو أُلغي
  const n = clone(o);
  if (it.kind === 'bill') n.billReq = it.at;
  if (it.kind === 'pay') n.payReq = { method: it.method, at: it.at, by: it.by, iid: it.iid };
  return [{ col: 'open', put: [n] }];
}

/* ---------- الواجهة ---------- */
function go(v) { W.view = v; render(); }

  if (W.view === 'login') return renderLogin(a);

  if (W.view === 'table') return renderTable(a);
}
function renderLogin(a) {
  const us = ((W.data && W.data.users) || []).filter(u => u.active !== false);
  a.innerHTML = `<div class="main"><div class="center"><h2>${esc(S().name || 'تطبيق النادل')}</h2><p class="mut">اختر اسمك ثم اكتب الرقم السري</p><div class="users">${us.map(u => `<button class="chip ${W.pinUser === u.id ? 'sel' : ''}" data-u="${u.id}">${esc(u.name)}</button>`).join('')}</div>

  a.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { W.pinUser = b.dataset.u; W.pin = ''; render(); });
  a.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === '⌫') W.pin = W.pin.slice(0, -1); else if (k === '✓') return tryLogin(); else if (W.pin.length < 8) W.pin += k;

  });
  $('#chg').onclick = () => { if (/DalalaWaiterApp/.test(navigator.userAgent)) { location.href = (/Android/.test(navigator.userAgent) ? 'https://localhost/' : 'capacitor://localhost/') + '#change'; return; } LS.del('w_key'); W.key = ''; go('key'); };
}
function tryLogin() {
  const u = W.data.users.find(x => x.id === W.pinUser);
  if (!u) return toast('اختر اسمك أولًا');
  if (String(u.pin) !== W.pin) { W.pin = ''; render(); return toast('الرقم السري غير صحيح'); }
  W.user = u; LS.set('w_user', u.id); W.pin = ''; go('tables');
}
function renderTables(a) {
  const tbs = W.data.tables || []; const zones = [...new Set(tbs.map(t => t.zone || 'الصالة'))];
  a.innerHTML = `<div class="bar"><span class="dot ${W.online ? 'on' : ''}"></span><h1>الطاولات</h1><small id="qn" class="mut"></small><span class="mut">${esc(W.user.name)}</span>${themeBtn()}<button class="btn" id="out">خروج</button></div>
  <div class="main">${zones.map(z => `<div class="zone">${esc(z)}</div><div class="tables">${tbs.filter(t => (t.zone || 'الصالة') === z).map(t => { const o = openOf(t.id); const tot = o ? calc(o).total : 0; return `<button class="tbl ${o ? (o.billReq ? 'bill' : 'busy') : ''}" data-t="${t.id}"><b>${esc(t.name)}</b><small>${o ? money(tot) : 'فارغة'}</small>${o && o.billReq ? '<small>طلب فاتورة</small>' : ''}</button>`; }).join('')}</div>`).join('') || '<p class="mut">لا توجد طاولات</p>'}</div>`;
  a.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { W.table = b.dataset.t; W.cart = []; W.cat = 'all'; W.q = ''; W.note = ''; W.cartOpen = false; go('table'); });
  $('#out').onclick = () => { W.user = null; LS.del('w_user'); go('login'); }; setDot();
}
function calc(o) {
  const s = S(); const sub = round(o.items.reduce((x, i) => x + i.price * i.qty, 0));
  let disc = 0; if (o.discount && o.discount.value > 0) disc = o.discount.type === 'pct' ? sub * o.discount.value / 100 : o.discount.value;
  disc = round(Math.min(disc, sub)); const after = sub - disc;
  const service = round((s.serviceRate > 0 && (!s.serviceDineOnly || o.type === 'dine')) ? after * s.serviceRate / 100 : 0);

function renderTable(a) {

    <div class="prods">${prods.map(p => `<button class="prod" data-p="${p.id}">${inCart(p.id) ? `<span class="q">${inCart(p.id)}</span>` : ''}${p.image && S().showImages ? `<img src="${esc(p.image)}" alt="">` : `<i class="ph">${esc(String(p.name||'?').trim().charAt(0))}</i>`}<b>${esc(p.name)}</b><span>${money(p.price)}</span></button>`).join('') || '<p class="mut">لا توجد أصناف</p>'}</div></div>
  <div class="cart ${W.cartOpen ? 'open' : ''}">${(W.cart.length || (o && o.items.length)) ? `<button class="ctog" id="ctog"><span class="ci">${W.cart.length ? W.cart.reduce((x, c) => x + c.qty, 0) : o.items.reduce((x, i) => x + i.qty, 0)}</span><span class="ct">${W.cart.length ? 'طلب جديد' : 'الطلب المُرسل'}</span><span class="cs">${W.cart.length ? money(cartTotal) : money(calc(o).total)}</span><span class="cc">${W.cartOpen ? '▾' : '▴'}</span></button>` : ''}<div class="list">
    ${o && o.items.length ? `<div class="mut" style="font-size:13px;margin-bottom:4px">مُرسل سابقًا</div>${o.items.map(i => `<div class="line sent"><div class="n">${esc(i.name)}${i.note ? `<small>» ${esc(i.note)}</small>` : ''}</div><b>× ${i.qty}</b></div>`).join('')}<div class="tot" style="margin:8px 0"><span>الحساب الحالي</span><span>${money(calc(o).total)}</span></div><hr style="border-color:var(--line)">` : ''}
    <div class="mut" style="font-size:13px;margin:6px 0">طلب جديد</div>
    ${W.cart.length ? W.cart.map((c, i) => `<div class="line"><div class="n">${esc(c.name)}<small>${money(c.price * c.qty)}</small>${c.note ? `<small>» ${esc(c.note)}</small>` : ''}<button class="btn" data-n="${i}" style="min-height:30px;padding:2px 10px;font-size:13px;margin-top:4px">ملاحظة</button></div><div class="qty"><button data-m="${i}">−</button><b>${c.qty}</b><button data-a="${i}">+</button></div></div>`).join('') : '<p class="mut">اضغط على الأصناف لإضافتها</p>'}
  </div><div class="foot">
    ${W.cart.length ? `<input id="onote" placeholder="ملاحظة للمطبخ (اختياري)" value="${esc(W.note)}"><div class="tot"><span>الجديد</span><span>${money(cartTotal)}</span></div><button class="btn ok" id="send">إرسال للمطبخ</button>` : ''}
    ${o ? `<div class="row"><button class="btn pri" id="bill">${o.billReq ? 'إعادة طباعة الفاتورة' : 'طلب الفاتورة'}</button><button class="btn warn" id="pay">دفع</button></div>` : ''}
  </div></div></div>`;
  $('#back').onclick = () => go('tables');
  const ctg = $('#ctog'); if (ctg) ctg.onclick = () => { W.cartOpen = !W.cartOpen; render(); };
  const fixPad = () => { const ct = $('.cart'), pr = $('.prods'); if (!ct || !pr) return; const phone = ct.getBoundingClientRect().top > 0 && getComputedStyle(ct).position === 'fixed'; pr.style.paddingBottom = phone ? (ct.offsetHeight + 16) + 'px' : ''; };
  fixPad(); requestAnimationFrame(fixPad); window.onresize = fixPad;
  $('#srch').oninput = e => { W.q = e.target.value; W._typing = true; const pos = e.target.selectionStart; render(); const s = $('#srch'); s.focus(); s.setSelectionRange(pos, pos); W._typing = false; };
  a.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { W.cat = b.dataset.c; render(); });

  a.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const i = +b.dataset.m; if (--W.cart[i].qty <= 0) W.cart.splice(i, 1); render(); });
  a.querySelectorAll('[data-n]').forEach(b => b.onclick = () => askNote(+b.dataset.n));
  const on = $('#onote'); if (on) on.oninput = e => { W.note = e.target.value; };
  const snd = $('#send'); if (snd) snd.onclick = () => {
    enqueue({ kind: 'send', tableId: W.table, items: W.cart.map(c => ({ pid: c.pid, qty: c.qty, note: c.note })), note: W.note });
    W.cart = []; W.note = ''; W.cartOpen = false; toast('تم الإرسال للمطبخ ✓'); go('tables');
  };
  const bl = $('#bill'); if (bl) bl.onclick = () => { if (W.cart.length) return toast('أرسل الطلب الجديد أولًا'); enqueue({ kind: 'bill', orderId: o.id }); toast('تم طلب طباعة الفاتورة'); go('tables'); };
  const py = $('#pay'); if (py) py.onclick = () => { if (W.cart.length) return toast('أرسل الطلب الجديد أولًا'); askPay(o); };
  for (const k in sc) { const e = $(k); if (e) { e.scrollTop = sc[k][0]; e.scrollLeft = sc[k][1]; } }
  setDot();
}
function modal(html) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div>' + html + '</div>'; m.onclick = e => { if (e.target === m) m.remove(); }; document.body.appendChild(m); return m; }
function askNote(i) {
  const c = W.cart[i]; const presets = ['بدون سكر', 'سكر زيادة', 'بدون بصل', 'حار', 'بدون ثلج', 'للأخذ'];
  const m = modal(`<h3>ملاحظة: ${esc(c.name)}</h3><div class="users" style="justify-content:flex-start">${presets.map(p => `<button class="chip" data-pp="${p}">${p}</button>`).join('')}</div><input id="nt" value="${esc(c.note)}" placeholder="اكتب ملاحظة"><p class="row"><button class="btn" id="nc">إلغاء</button><button class="btn pri" id="ns">حفظ</button></p>`);
  m.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => { const v = $('#nt', m); v.value = (v.value ? v.value + '، ' : '') + b.dataset.pp; });
  $('#nc', m).onclick = () => m.remove();
  $('#ns', m).onclick = () => { c.note = $('#nt', m).value.trim(); const same = W.cart.find((x, j) => j !== i && x.pid === c.pid && x.note === c.note); if (same) { same.qty += c.qty; W.cart.splice(i, 1); } m.remove(); render(); };
}
function askPay(o) {
  const t = calc(o).total;
  const m = modal(`<h3>دفع طاولة ${esc(tableName(o.tableId))}</h3><div class="tot" style="margin:10px 0 16px"><span>الإجمالي</span><span>${money(t)}</span></div><p class="mut" style="font-size:13px">يُسجَّل الدفع في الكاشير وتُطبع الفاتورة هناك.</p><div class="row"><button class="btn ok" data-m="cash">نقدي</button><button class="btn pri" data-m="card">بطاقة</button></div><p><button class="btn" id="pc" style="width:100%">إلغاء</button></p>`);
  $('#pc', m).onclick = () => m.remove();
  m.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { enqueue({ kind: 'pay', orderId: o.id, method: b.dataset.m }); m.remove(); toast('تم إرسال طلب الدفع للكاشير'); go('tables'); });
}

/* ---------- البدء ---------- */
async function boot() {
  go('boot');
  const h = /[#&]k=([A-Za-z0-9-]+)/.exec(location.hash); if (h) { W.key = h[1].toUpperCase(); LS.set('w_key', W.key); history.replaceState(null, '', location.pathname); }
  if (!W.key) return go('key');
  try { await snapshot(); W.online = true; } catch (e) { if (e.auth) { W.key = ''; LS.del('w_key'); return go('key'); } W.online = false; }
  if (!W.data) { W.view = 'boot'; $('#app').innerHTML = '<div class="main"><div class="center"><h2>تعذر الاتصال بالكاشير</h2><p class="mut">تأكد أن الهاتف على نفس شبكة الواي فاي وأن الكاشير يعمل.</p><button class="btn pri" onclick="boot()">إعادة المحاولة</button></div></div>'; return; }
  const uidSaved = LS.get('w_user', null); const u = uidSaved && W.data.users.find(x => x.id === uidSaved);
  if (u) W.user = u;
  go(W.user ? 'tables' : 'login'); pollLoop(); flush();
}
window.addEventListener('online', () => flush());
setInterval(() => { if (W.queue.length) flush(); }, 5000);
boot();
</script>
