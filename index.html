<body class="text-slate-100 h-screen overflow-hidden">

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="fixed inset-0 z-40 flex items-center justify-center p-4">
  <div class="w-full max-w-4xl grid md:grid-cols-2 gap-6 items-center">
    <div class="text-center md:text-right space-y-4">
      <div id="loginLogo" class="w-20 h-20 mx-auto md:mx-0 rounded-3xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-2xl shadow-sky-500/30">
        <i class="fa-solid fa-utensils text-white text-4xl"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-white" id="loginTitle">منظومة دلالة</h1>
      <p class="text-slate-400">نظام نقاط البيع للمطاعم والكافيهات</p>
      <div class="text-slate-500 text-sm num" id="loginClock"></div>
    </div>
    <div class="glass-panel rounded-3xl p-6 shadow-2xl">
      <h2 class="font-bold text-lg mb-3"><i class="fa-solid fa-user-lock text-sky-400 ml-1"></i> تسجيل الدخول</h2>
      <div id="loginUsers" class="grid grid-cols-2 gap-2 mb-4 max-h-44 overflow-y-auto"></div>
      <div id="pinDots" class="flex justify-center gap-3 my-4"></div>
      <div class="grid grid-cols-3 gap-2" id="pinPad"></div>
      <p class="text-[11px] text-slate-500 mt-4 text-center">أول دخول: المدير <b class="num">1234</b> — الكاشير <b class="num">0000</b> (غيّرها من إدارة المستخدمين)</p>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden h-screen flex flex-col">
  <header class="glass-panel border-b border-slate-700/50 px-4 py-2 flex items-center justify-between gap-3 z-20 shrink-0">
    <div class="flex items-center gap-3 min-w-0">
      <div id="brandLogo" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20 shrink-0 overflow-hidden">
        <i class="fa-solid fa-utensils text-white text-xl"></i>
      </div>
      <div class="min-w-0">
        <h1 class="text-base font-bold leading-tight text-white truncate" id="brandName">منظومة دلالة</h1>
        <p class="text-[11px] text-slate-400 flex items-center gap-3 flex-wrap">
          <span><i class="fa-solid fa-user text-sky-400"></i> <b class="text-slate-200" id="hdrUser">-</b></span>
          <span id="hdrShift"></span>
        </p>
      </div>
    </div>
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar" id="hdrActions">
      <button onclick="POS.openSearch()" class="btn-active flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs font-medium whitespace-nowrap"><span class="kbd bg-sky-500/20 text-sky-400 border-sky-500/30">F1</span>بحث</button>
      <button onclick="POS.newOrder()" class="btn-active flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs font-medium whitespace-nowrap"><span class="kbd bg-emerald-500/20 text-emerald-400 border-emerald-500/30">F3</span>طلب جديد</button>
      <button id="hdrHold" onclick="POS.hold()" class="btn-active flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs font-medium whitespace-nowrap"><span class="kbd bg-amber-500/20 text-amber-400 border-amber-500/30">F4</span>حفظ/مطبخ</button>
      <button id="hdrTables" onclick="App.go('tables')" class="btn-active flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs font-medium whitespace-nowrap"><span class="kbd bg-indigo-500/20 text-indigo-400 border-indigo-500/30">F5</span>الطاولات <span id="openBadge" class="chip bg-amber-500/20 text-amber-300 border-amber-500/30 hidden"></span></button>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <div class="hidden lg:block text-left">
        <div id="hdrTime" class="num font-bold text-slate-200 text-sm leading-none">--:--</div>
        <div id="hdrDate" class="num text-[10px] text-slate-400"></div>
      </div>
      <button onclick="App.toggleFullscreen()" title="ملء الشاشة" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300"><i class="fa-solid fa-expand"></i></button>
      <button id="themeBtn" onclick="Theme.toggle()" title="الوضع الليلي / الفاتح" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-300"><i class="fa-solid fa-sun"></i></button>
      <button onclick="App.lock()" title="قفل / تبديل المستخدم" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-rose-900/50 border border-slate-700 text-rose-300"><i class="fa-solid fa-lock"></i></button>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar -->
    <nav id="sidebar" class="w-20 shrink-0 glass-panel border-l border-slate-700/50 p-2 flex flex-col gap-1 overflow-y-auto no-scrollbar"></nav>

    <!-- Views -->
    <main class="flex-1 overflow-hidden relative">

      <!-- POS VIEW -->
      <section data-view="pos" class="view h-full grid grid-cols-12 gap-3 p-3 overflow-hidden">
        <div class="col-span-12 lg:col-span-7 xl:col-span-8 flex flex-col h-full overflow-hidden gap-3">
          <div class="hidden items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar shrink-0" id="openStrip"></div>
          <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar shrink-0" id="posCats"></div>
          <div class="flex items-center gap-2 shrink-0">
            <div class="relative flex-1">
              <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="text" id="posSearch" placeholder="ابحث باسم الصنف أو الكود / الباركود ثم Enter..." class="inp pr-9">
            </div>
          </div>
          <div class="flex-1 overflow-y-auto pl-1">
            <div id="posGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-2.5"></div>
          </div>
        </div>

        <div id="orderPanel" class="col-span-12 lg:col-span-5 xl:col-span-4 flex flex-col h-full bg-slate-900/90 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
          <div class="md:hidden flex items-center justify-between px-3 py-2 bg-slate-950 border-b border-slate-800">
            <b class="text-sm"><i class="fa-solid fa-receipt text-sky-400"></i> الطلب الحالي</b>
            <button onclick="POS.toggleCart(false)" class="btn-ghost py-1 text-xs"><i class="fa-solid fa-arrow-right"></i> رجوع للأصناف</button>
          </div>
          <!-- order type -->
          <div class="p-2 bg-slate-800/60 border-b border-slate-800 space-y-2" id="orderHead">
            <div class="grid grid-cols-3 gap-1 bg-slate-950/60 p-1 rounded-xl" id="orderTypeTabs"></div>
            <div class="flex items-center gap-2" id="orderMeta"></div>
          </div>
          <div class="flex-1 overflow-y-auto p-2 space-y-1.5" id="orderItems"></div>
          <div class="p-3 bg-slate-950/80 border-t border-slate-800 space-y-1 text-xs" id="orderTotals"></div>
          <div class="p-2.5 bg-slate-900 border-t border-slate-800 flex gap-2">
            <div class="grid grid-cols-4 gap-1 flex-1" id="numpad"></div>
            <div class="flex flex-col gap-1.5 w-36">
              <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 cursor-pointer" onclick="POS.tenderDialog()" title="اضغط لإدخال المبلغ المدفوع">
                <span class="text-[10px] text-slate-400 block">المدفوع (اضغط للتعديل):</span>
                <div id="tendered" class="num text-emerald-400 font-bold text-left text-lg leading-tight">0</div>
                <div id="changeDue" class="text-[10px] text-slate-400 num"></div>
              </div>
              <button onclick="POS.pay('cash')" class="btn-active flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl flex items-center justify-center gap-2 text-sm py-2 shadow-lg shadow-emerald-900/30"><i class="fa-solid fa-money-bill-wave"></i>نقدي <span class="kbd border-white/30 bg-white/10">F8</span></button>
              <button onclick="POS.pay('card')" class="btn-active bg-slate-800 hover:bg-slate-700 text-sky-300 font-bold border border-sky-500/30 rounded-xl flex items-center justify-center gap-2 text-xs py-2"><i class="fa-solid fa-credit-card"></i>بطاقة <span class="kbd border-sky-500/30">F9</span></button>
              <button onclick="POS.pay('split')" class="btn-active bg-slate-800 hover:bg-slate-700 text-violet-300 font-bold border border-violet-500/30 rounded-xl flex items-center justify-center gap-2 text-xs py-1.5"><i class="fa-solid fa-code-branch"></i>دفع مختلط</button>
            </div>
          </div>
        </div>
      </section>

      <section data-view="tables" class="view hidden h-full overflow-y-auto p-4"></section>
      <section data-view="kitchen" class="view hidden h-full overflow-y-auto p-4"></section>
      <section data-view="invoices" class="view hidden h-full overflow-hidden p-4"></section>
      <section data-view="reports" class="view hidden h-full overflow-y-auto p-4"></section>
      <section data-view="expenses" class="view hidden h-full overflow-y-auto p-4"></section>
      <section data-view="products" class="view hidden h-full overflow-hidden p-4"></section>
      <section data-view="inventory" class="view hidden h-full overflow-y-auto p-4"></section>
      <section data-view="users" class="view hidden h-full overflow-y-auto p-4"></section>
      <section data-view="settings" class="view hidden h-full overflow-y-auto p-4"></section>
    </main>
  </div>
</div>

<button id="cartFab" onclick="POS.toggleCart(true)" class="hidden fixed z-30 left-3 right-3 bottom-[70px] items-center justify-between gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold rounded-2xl px-4 py-3 shadow-2xl shadow-emerald-900/50">
  <span><i class="fa-solid fa-basket-shopping"></i> عرض الطلب <span id="fabCount" class="num"></span></span><span id="fabTotal" class="num text-lg"></span>
</button>
<div id="modalRoot"></div>
<div id="toast" class="fixed bottom-5 left-5 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 translate-y-24 opacity-0 transition-all duration-300 z-[70] pointer-events-none">
  <i class="fa-solid fa-circle-info text-sky-400 text-lg" id="toastIcon"></i>
  <span id="toastMsg" class="text-sm font-medium"></span>
</div>

/* ---------------- Storage ---------------- */
const Store = {
  data: null, _t: null,
  isDesktop: !!(window.dalala && window.dalala.isDesktop),
  load() {
    let raw = null;
    try { raw = this.isDesktop ? window.dalala.load() : localStorage.getItem('dalala_pos_v1'); } catch (e) { console.error(e); }
    if (raw) { try { this.data = JSON.parse(raw); } catch (e) { console.error('bad data', e); } }
    if (!this.data || !this.data.settings) { this.data = defaultData(); this.saveNow(); }
    // migrate / fill missing keys
    const d = defaultData();
    for (const k in d) if (this.data[k] === undefined) this.data[k] = d[k];
    for (const k in d.settings) if (this.data.settings[k] === undefined) this.data.settings[k] = d.settings[k];
    if (this.data.settings._printUiV3 !== 1) { this.data.settings.silentPrint = true; this.data.settings._printUiV3 = 1; } // print directly (no print window) by default
    return this.data;
  },
  save() { clearTimeout(this._t); this._t = setTimeout(() => this.saveNow(), 250); },
  saveNow() {
    clearTimeout(this._t);
    const json = JSON.stringify(this.data);
    try {
      if (this.isDesktop) { if (window.dalala.save(json) === false) toast('تعذر حفظ البيانات على القرص!', 'error'); }
      else localStorage.setItem('dalala_pos_v1', json);
    } catch (e) { console.error(e); toast('تعذر حفظ البيانات! المساحة ممتلئة؟', 'error'); }

};

let _toastT;

let _ac;
function beep(freq = 880, dur = .05) {

    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.frequency.value = freq; g.gain.value = .05; o.connect(g); g.connect(_ac.destination);
    o.start(); o.stop(_ac.currentTime + dur);

}

/* ---------------- Modals ---------------- */
const Modal = {
  stack: [],
  open(html, opts = {}) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4';
    wrap.innerHTML = `<div class="modal-box bg-slate-900 border border-slate-700 rounded-2xl w-full ${opts.size || 'max-w-lg'} max-h-[92vh] flex flex-col shadow-2xl">
      ${opts.title ? `<div class="flex justify-between items-center border-b border-slate-800 px-5 py-3 shrink-0">
        <h3 class="text-base font-bold text-white flex items-center gap-2">${opts.icon ? `<i class="fa-solid ${opts.icon} text-sky-400"></i>` : ''}${opts.title}</h3>
        <button data-close class="w-8 h-8 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div>` : ''}
      <div class="modal-body overflow-y-auto p-5">${html}</div></div>`;
    wrap.addEventListener('mousedown', e => { if (e.target === wrap && !opts.sticky) this.close(); });
    $$('[data-close]', wrap).forEach(b => b.onclick = () => this.close());
    $('#modalRoot').appendChild(wrap);
    this.stack.push({ wrap, onClose: opts.onClose });
    setTimeout(() => { const f = $('[autofocus]', wrap) || $('input:not([type=checkbox]):not([type=file]),textarea', wrap); if (f) { f.focus(); if (f.select) f.select(); } }, 30);
    return wrap;
  },
  close() {
    const m = this.stack.pop(); if (!m) return;
    m.wrap.remove(); if (m.onClose) m.onClose();
  },
  closeAll() { while (this.stack.length) this.close(); },
  get isOpen() { return this.stack.length > 0; },
  top() { return this.stack.length ? this.stack[this.stack.length - 1].wrap : null; }
};

function confirmBox(msg, { ok = 'تأكيد', danger = false, title = 'تأكيد' } = {}) {
  return new Promise(res => {
    let done = false;
    const w = Modal.open(`<p class="text-slate-300 leading-relaxed mb-5">${msg}</p>
      <div class="flex gap-2 justify-end"><button class="btn-ghost" data-no>إلغاء</button>
      <button class="${danger ? 'btn-danger' : 'btn-primary'}" data-yes autofocus>${ok}</button></div>`,
      { title, icon: danger ? 'fa-triangle-exclamation' : 'fa-circle-question', size: 'max-w-md', onClose: () => { if (!done) res(false); } });
    $('[data-yes]', w).onclick = () => { done = true; Modal.close(); res(true); };
    $('[data-no]', w).onclick = () => { done = true; Modal.close(); res(false); };
  });
}

function promptBox(title, { value = '', type = 'text', label = '', placeholder = '', ok = 'حفظ' } = {}) {
  return new Promise(res => {
    let done = false;
    const w = Modal.open(`${label ? `<label class="lbl">${label}</label>` : ''}
      <input class="inp text-base" type="${type}" ${type === 'number' ? 'step="any" inputmode="decimal"' : ''} value="${esc(value)}" placeholder="${esc(placeholder)}" data-inp>
      <div class="flex gap-2 justify-end mt-5"><button class="btn-ghost" data-close>إلغاء</button><button class="btn-primary" data-ok>${ok}</button></div>`,
      { title, icon: 'fa-pen', size: 'max-w-md', onClose: () => { if (!done) res(null); } });
    const inp = $('[data-inp]', w);
    const go = () => { done = true; const v = inp.value; Modal.close(); res(v); };
    $('[data-ok]', w).onclick = go;
    $('[data-close]', w).onclick = () => Modal.close();
    inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  });
}

/* Ask admin PIN when cashier attempts a protected action */
function requireAdmin(reason) {
  return new Promise(res => {
    if (App.user && App.user.role === 'admin') return res(true);
    let done = false;
    const w = Modal.open(`<p class="text-sm text-slate-400 mb-3">${reason || 'هذه العملية تتطلب صلاحية المدير'}</p>
      <input type="password" inputmode="numeric" class="inp text-center text-2xl tracking-[.5em] num" placeholder="••••" data-pin>
      <div class="flex gap-2 justify-end mt-4"><button class="btn-ghost" data-close>إلغاء</button><button class="btn-primary" data-ok>تأكيد</button></div>`,
      { title: 'رمز المدير', icon: 'fa-shield-halved', size: 'max-w-sm', onClose: () => { if (!done) res(false); } });
    const inp = $('[data-pin]', w);
    const go = () => {
      const u = DB.users.find(x => x.role === 'admin' && x.active && x.pin === inp.value);
      if (!u) { inp.classList.add('shake'); inp.value = ''; setTimeout(() => inp.classList.remove('shake'), 400); toast('رمز غير صحيح', 'error'); return; }
      done = true; Modal.close(); logAct('موافقة المدير', u.name + ' — ' + (reason || '')); res(true);
    };
    $('[data-ok]', w).onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    $('[data-close]', w).onclick = () => Modal.close();
  });
}

function downloadFile(name, content, mime = 'application/octet-stream') {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function toCSV(rows) {
  return '﻿' + rows.map(r => r.map(c => { c = c == null ? '' : String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\r\n');
}
function readFileAs(file, how = 'text') {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; how === 'url' ? r.readAsDataURL(file) : r.readAsText(file); });
}
function resizeImage(dataUrl, max = 240) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .85));
    };
    img.onerror = () => res('');
    img.src = dataUrl;
  });
}

const Backup = {
  bridge() { return window.dalalaBackup || null; },

  async auto(force) {

  },

    $('#pinDots').innerHTML = Array.from({ length: len }, (_, i) => `<span class="w-4 h-4 rounded-full border-2 ${i < this.pin.length ? 'bg-sky-400 border-sky-400' : 'border-slate-600'}"></span>`).join('');
    if (err) { $('#pinDots').classList.add('shake'); setTimeout(() => $('#pinDots').classList.remove('shake'), 400); }
  },
  pinKey(k) {
    if (k === 'C') this.pin = ''; else if (k === '⌫') this.pin = this.pin.slice(0, -1); else if (this.pin.length < 8) this.pin += k;
    const u = DB.users.find(x => x.id === this.loginUser);
    this.drawPin();
    setTimeout(() => beep(1200, .02), 0); // الصوت بعد رسم النقاط حتى لا يؤخر الاستجابة
    if (u && this.pin.length >= u.pin.length) {
      if (this.pin === u.pin) this.login(u);
      else { this.pin = ''; this.drawPin(true); toast('الرمز السري غير صحيح', 'error'); }
    }
  },
  login(u) {
    this.user = u; this.pin = '';
    logAct('تسجيل دخول');
    $('#loginScreen').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#hdrUser').textContent = u.name + (u.role === 'admin' ? ' (مدير)' : '');
    this.brand();
    this.applyMode();
    this.go('pos');
    this.updateShiftBadge();
    if (!S().modeChosen && u.role === 'admin') this.chooseMode(true);
    else if (S().requireShift && !Shift.current()) Shift.openDialog();
    Store.save();
  },
  lock() {
    if (Modal.isOpen) Modal.closeAll();
    logAct('تسجيل خروج');
    this.user = null; Store.saveNow(); Backup.auto();
    $('#app').classList.add('hidden');
    $('#loginScreen').classList.remove('hidden');
    this.renderLogin();
  },
  isAdmin() { return this.user && this.user.role === 'admin'; },

  /* ---------- Navigation ---------- */
  renderNav() {
    $('#sidebar').innerHTML = NAV.filter(n => (!n.admin || this.isAdmin()) && (!n.perm || Perm.can(n.perm)) && !(n.full && isQuick())).map(n => `
      <button class="nav-btn ${this.view === n.id ? 'active' : ''}" onclick="App.go('${n.id}')"><i class="fa-solid ${n.icon} text-lg"></i>${n.name}</button>`).join('') +
      `<div class="flex-1"></div>
       <button class="nav-btn" onclick="Shift.closeDialog()"><i class="fa-solid fa-cash-register text-lg text-amber-400"></i>إغلاق الوردية</button>
       <div class="text-center text-[9px] text-slate-600 py-1">v${APP_VERSION}</div>`;
  },
  applyMode() {
    const q = isQuick();
    $('#hdrHold').classList.toggle('hidden', q); $('#hdrTables').classList.toggle('hidden', q);
    $('#orderTypeTabs').classList.toggle('hidden', q);
    if (q && POS.cur && !POS.cur.items.length) POS.cur = POS.blank('take');
    if (q && ['tables', 'kitchen'].includes(this.view)) this.view = 'pos';
    this.renderNav();
  },
  chooseMode(first) {
    const card = (m, icon, title, desc) => `<button data-m="${m}" class="press text-right card p-4 hover:border-sky-500 transition ${S().mode === m && !first ? 'border-sky-500 bg-sky-500/10' : ''}">
      <div class="w-12 h-12 rounded-xl bg-sky-500/15 text-sky-300 flex items-center justify-center mb-3"><i class="fa-solid ${icon} text-2xl"></i></div>
      <div class="font-extrabold text-base mb-1">${title}</div><div class="text-xs text-slate-400 leading-relaxed">${desc}</div></button>`;
    const w = Modal.open(`<p class="text-sm text-slate-400 mb-4">اختر طريقة عمل محلّك (يمكن تغييرها لاحقاً من الإعدادات):</p>
      <div class="grid sm:grid-cols-2 gap-3">
        ${card('quick', 'fa-bolt', 'بيع فوري (كافيه / تيك أواي)', 'بدون طاولات ولا مطبخ. اختر الأصناف ← ادفع ← طلب جديد مباشرة. مناسب للمقاهي التي يشتري فيها الزبون ويخرج.')}
        ${card('restaurant', 'fa-utensils', 'مطعم كامل', 'صالة وطاولات وتيك أوي وتوصيل، حفظ الطلبات على الطاولات وتذاكر وشاشة المطبخ.')}
      </div>`, { title: 'نوع النشاط', icon: 'fa-store', size: 'max-w-2xl', sticky: !!first });
    $$('[data-m]', w).forEach(b => b.onclick = () => {
      const m = b.dataset.m;
      if (m === 'quick' && S().mode !== 'quick') S().kitchenPrint = false;
      if (m === 'restaurant' && S().mode !== 'restaurant') S().kitchenPrint = true;
      S().mode = m; S().modeChosen = true; Store.save(); Modal.close();
      this.applyMode(); this.refresh();
      toast(m === 'quick' ? 'تم تفعيل وضع البيع الفوري' : 'تم تفعيل وضع المطعم الكامل', 'success');
      if (S().requireShift && !Shift.current()) Shift.openDialog();
    });
  },
  go(id) {
    const n = NAV.find(x => x.id === id);
    if (n && n.full && isQuick()) id = 'pos';
    if (n && ((n.admin && !this.isAdmin()) || (n.perm && !Perm.can(n.perm)))) return toast('لا تملك صلاحية الوصول', 'error');
    this.view = id;
    $$('.view').forEach(v => v.classList.toggle('hidden', v.dataset.view !== id));
    $('#cartFab').classList.toggle('on-pos', id === 'pos'); if (id !== 'pos') POS.toggleCart(false);
    this.renderNav();
    this.refresh();
  },
  refresh() {
    if (this.view === 'pos') POS.render();
    else if (VIEWS[this.view]) VIEWS[this.view]($(`[data-view="${this.view}"]`));
    this.updateOpenBadge();
  },
  updateOpenBadge() {
    const n = DB.open.length, b = $('#openBadge');
    b.textContent = n; b.classList.toggle('hidden', !n);
  },
  updateShiftBadge() {
    const sh = Shift.current();
    $('#hdrShift').innerHTML = sh
      ? `<span class="text-emerald-400"><i class="fa-solid fa-circle text-[7px] pulse-dot"></i> وردية مفتوحة منذ ${fmtTime(sh.openAt)}</span>`
      : `<span class="text-rose-400"><i class="fa-solid fa-circle text-[7px]"></i> لا توجد وردية مفتوحة</span>`;
  },
  toggleFullscreen() {
    if (window.dalala && window.dalala.toggleFullscreen) return window.dalala.toggleFullscreen();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    else document.exitFullscreen && document.exitFullscreen();
  },

  keys() {
    window.addEventListener('keydown', e => {
      if ($('#app').classList.contains('hidden')) {
        if (/^[0-9]$/.test(e.key)) this.pinKey(e.key);
        else if (e.key === 'Backspace') this.pinKey('⌫');
        else if (e.key === 'Escape') this.pinKey('C');
        return;
      }
      if (e.key === 'Escape' && Modal.isOpen) { e.preventDefault(); return Modal.close(); }
      const map = { F1: () => POS.openSearch(), F2: () => POS.clear(), F3: () => POS.newOrder(), F4: () => POS.hold(), F5: () => this.go('tables'), F6: () => POS.printPreBill(), F8: () => POS.pay('cash'), F9: () => POS.pay('card'), F11: () => this.toggleFullscreen() };
      if (isQuick() && (e.key === 'F4' || e.key === 'F5')) { e.preventDefault(); return; }
      if (map[e.key]) { e.preventDefault(); if (Modal.isOpen && e.key !== 'F11') return; if (this.view !== 'pos' && !['F5', 'F11'].includes(e.key)) this.go('pos'); map[e.key](); return; }
      // numpad typing on POS when not focused in an input
      if (this.view === 'pos' && !Modal.isOpen && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
        if (/^[0-9.]$/.test(e.key)) { POS.numKey(e.key); e.preventDefault(); }
        else if (e.key === 'Backspace') { POS.numKey('⌫'); e.preventDefault(); }
        else if (e.key === 'Enter') { POS.pay('cash'); e.preventDefault(); }
      }
    });
  }
};

/* =====================================================================
   Shifts (الورديات)
   ===================================================================== */
const Shift = {
  current() { return DB.shifts.find(s => s.status === 'open'); },
  openDialog() {
    const w = Modal.open(`
      <p class="text-sm text-slate-400 mb-3">أدخل رصيد الصندوق الافتتاحي (العهدة) لبدء الوردية.</p>
      <label class="lbl">المبلغ الافتتاحي</label>
      <input class="inp text-xl num" type="number" step="any" inputmode="decimal" value="0" data-cash>
      <div class="flex gap-2 justify-end mt-5"><button class="btn-ghost" data-close>لاحقاً</button><button class="btn-success" data-ok><i class="fa-solid fa-play"></i> فتح الوردية</button></div>`,
      { title: 'فتح وردية جديدة', icon: 'fa-door-open', size: 'max-w-md' });
    const go = () => {
      const sh = { id: uid(), no: DB.shifts.length + 1, userId: App.user.id, userName: App.user.name, openAt: Date.now(), openCash: +$('[data-cash]', w).value || 0, status: 'open' };
      DB.shifts.push(sh); logAct('فتح وردية', money(sh.openCash)); Store.save();
      Modal.close(); App.updateShiftBadge(); toast('تم فتح الوردية', 'success');
    };
    $('[data-ok]', w).onclick = go; $('[data-cash]', w).onkeydown = e => e.key === 'Enter' && go();
  },
  summary(sh) {
    const orders = DB.orders.filter(o => o.shiftId === sh.id);
    const paid = orders.filter(o => o.status === 'paid');
    const sum = (arr, f) => arr.reduce((a, o) => a + f(o), 0);
    const cash = sum(paid, o => o.pay.cash), card = sum(paid, o => o.pay.card);
    const exp = sum(DB.expenses.filter(e => e.shiftId === sh.id), e => e.amount);
    return {
      count: paid.length, voids: orders.filter(o => o.status !== 'paid').length,
      sales: sum(paid, o => o.total), discount: sum(paid, o => o.discountAmt), cash, card, exp,
      expected: round(sh.openCash + cash - exp)
    };
  },
  closeDialog() {
    const sh = this.current();
    if (!sh) return S().requireShift ? this.openDialog() : toast('لا توجد وردية مفتوحة', 'warning');
    if (DB.open.length) toast(`تنبيه: يوجد ${DB.open.length} طلب مفتوح لم يُدفع بعد`, 'warning');
    const s = this.summary(sh);
    const row = (k, v, c = '') => `<div class="flex justify-between py-1.5 border-b border-slate-800"><span class="text-slate-400">${k}</span><b class="num ${c}">${v}</b></div>`;
    const w = Modal.open(`
      <div class="text-sm mb-4">
        ${row('الكاشير', esc(sh.userName))}${row('بداية الوردية', fmtDT(sh.openAt))}
        ${row('عدد الفواتير', s.count)}${row('الفواتير الملغاة', s.voids, 'text-rose-400')}
        ${row('إجمالي المبيعات', money(s.sales), 'text-emerald-400')}${row('الخصومات', money(s.discount))}
        ${row('مبيعات نقدية', money(s.cash))}${row('مبيعات بطاقة', money(s.card))}
        ${row('رصيد افتتاحي', money(sh.openCash))}${row('المصروفات', money(s.exp), 'text-rose-400')}
        ${row('النقد المتوقع في الدرج', money(s.expected), 'text-sky-300 text-base')}
      </div>
      <label class="lbl">النقد الفعلي في الدرج (الجرد)</label>
      <input class="inp text-xl num" type="number" step="any" inputmode="decimal" value="${s.expected}" data-cash>
      <div class="text-sm mt-2" data-diff></div>
      <label class="lbl mt-3">ملاحظات</label><input class="inp" data-note>
      <div class="flex gap-2 justify-end mt-5"><button class="btn-ghost" data-close>إلغاء</button>
      <button class="btn-warn" data-ok><i class="fa-solid fa-lock"></i> إغلاق الوردية وطباعة التقرير</button></div>`,
      { title: 'إغلاق الوردية (تقرير Z)', icon: 'fa-cash-register', size: 'max-w-md' });
    const inp = $('[data-cash]', w);
    const upd = () => { const d = round((+inp.value || 0) - s.expected); $('[data-diff]', w).innerHTML = `الفرق: <b class="num ${d < 0 ? 'text-rose-400' : d > 0 ? 'text-amber-300' : 'text-emerald-400'}">${money(d)}</b> ${d < 0 ? '(عجز)' : d > 0 ? '(زيادة)' : '(مطابق)'}`; };
    inp.oninput = upd; upd();
    $('[data-ok]', w).onclick = () => {
      Object.assign(sh, { status: 'closed', closeAt: Date.now(), closeCash: +inp.value || 0, expected: s.expected, diff: round((+inp.value || 0) - s.expected), note: $('[data-note]', w).value, closedBy: App.user.name, summary: s });
      logAct('إغلاق وردية', 'فرق ' + money(sh.diff)); Store.saveNow(); Backup.auto();
      Modal.close(); App.updateShiftBadge();
      Printer.shiftReport(sh);
      toast('تم إغلاق الوردية', 'success');
      setTimeout(() => App.lock(), 600);
    };
  },
  ensure() {
    if (!S().requireShift) return true;
    if (this.current()) return true;
    toast('يجب فتح وردية أولاً', 'warning'); this.openDialog(); return false;
  }
};

/* 03-pos.js */
/* =====================================================================
   POS — نقطة البيع
   ===================================================================== */
const TYPES = { dine: { name: 'صالة', icon: 'fa-chair' }, take: { name: 'تيك أوي', icon: 'fa-bag-shopping' }, delivery: { name: 'توصيل', icon: 'fa-motorcycle' } };

function calcOrder(o) {
  const s = S();
  const subtotal = round(o.items.reduce((a, i) => a + i.price * i.qty, 0));
  let discountAmt = 0;
  if (o.discount && o.discount.value > 0) discountAmt = o.discount.type === 'pct' ? subtotal * o.discount.value / 100 : o.discount.value;
  discountAmt = round(Math.min(discountAmt, subtotal));
  const after = subtotal - discountAmt;
  const service = round((s.serviceRate > 0 && (!s.serviceDineOnly || o.type === 'dine')) ? after * s.serviceRate / 100 : 0);
  const delivery = o.type === 'delivery' ? round(+o.deliveryFee || 0) : 0;
  const tax = round(s.taxRate > 0 ? (after + service) * s.taxRate / 100 : 0);
  const total = round(after + service + tax + delivery);
  const qty = o.items.reduce((a, i) => a + i.qty, 0);
  return { subtotal, discountAmt, service, tax, delivery, total, qty };
}
function nextDailyNo() {
  const s = S(), k = dayKey(Date.now());
  if (s.dailyNo.day !== k) s.dailyNo = { day: k, n: 0 };
  return ++s.dailyNo.n;
}
function tableName(id) { const t = DB.tables.find(x => x.id === id); return t ? t.name : '-'; }
function orderLabel(o) {
  if (o.type === 'dine') return 'طاولة ' + tableName(o.tableId);
  return TYPES[o.type].name + (o.dailyNo ? ' رقم ' + o.dailyNo : '') + (o.customer && o.customer.name ? ' — ' + o.customer.name : '');
}

const POS = {
  cur: null, cat: 'all', tendered: '',

  blank(type) {
    return { id: null, type: isQuick() ? 'take' : (type || (this.cur ? this.cur.type : 'dine')), tableId: null, items: [], discount: { type: 'pct', value: 0 }, customer: { name: '', phone: '', address: '' }, deliveryFee: S().deliveryFee, note: '', createdAt: null, dailyNo: null };
  },
  ensureCur() { if (!this.cur) this.cur = this.blank('dine'); },
  /** شريط الطلبات المفتوحة: انتقال سريع بين الطاولات والطلبات */
  renderStrip() {
    const el = $('#openStrip'); if (!el) return;
    if (isQuick() || (!DB.open.length && !this.cur.editInv)) { el.classList.add('hidden'); el.classList.remove('flex'); return; }
    const c = this.cur;
    const chip = (id, label, sub, on) => `<button onclick="POS.switchTo('${id}')" class="press shrink-0 px-3 py-1.5 rounded-xl border text-xs font-bold whitespace-nowrap ${on ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700'}">${esc(label)}${sub ? ` <span class="num opacity-80">${sub}</span>` : ''}</button>`;
    el.innerHTML = `<span class="text-[10px] text-slate-500 shrink-0"><i class="fa-solid fa-clock-rotate-left"></i> المفتوحة</span>` +
      DB.open.map(o => chip(o.id, o.type === 'dine' ? 'طاولة ' + tableName(o.tableId) : orderLabel(o), money(calcOrder(o).total, false), c.id === o.id && !c.editInv)).join('') +
      chip('new', '+ جديد', '', !c.id && !c.editInv);
    el.classList.remove('hidden'); el.classList.add('flex');
  },
  isDirty() {
    const c = this.cur; if (c.editInv) return Inv.editDirty();
    if (!c.id) return c.items.length > 0;
    const o = DB.open.find(x => x.id === c.id); if (!o) return c.items.length > 0;
    return JSON.stringify([c.items, c.note, c.discount, c.tableId]) !== JSON.stringify([o.items, o.note, o.discount, o.tableId]);
  },
  async switchTo(id) {
    const c = this.cur;
    if (id !== 'new' && c.id === id && !c.editInv) return;
    if (this.isDirty()) {
      if (c.editInv) { if (!(await confirmBox('تم تعديل الفاتورة ولم تُحفظ. تجاهل التعديلات والانتقال؟', { ok: 'تجاهل وانتقل', danger: true }))) return; }
      else {
        if (c.type === 'dine' && !c.tableId) return toast('اختر الطاولة للطلب الحالي أولًا (أو امسحه)', 'warning');
        if (!(await confirmBox('الطلب الحالي لم يُحفظ. حفظه وإرساله للمطبخ ثم الانتقال؟', { ok: 'حفظ وانتقال' }))) return;
        this.hold(true); if (this.cur.items.length) return;
      }
    }
    if (id === 'new') { this.cur = this.blank(); this.tendered = ''; this.sel = null; this.render(); } else this.load(id);
  },

  render() {
    this.ensureCur();
    this.renderCats(); this.renderGrid(); this.renderOrder();
    const inp = $('#posSearch');
    if (!inp._bound) {
      inp._bound = true;
      inp.oninput = () => this.renderGrid();
      inp.onkeydown = e => {
        if (e.key === 'Enter') {
          const q = inp.value.trim(); if (!q) return;
          const p = DB.products.find(x => x.active && x.code === q) || (this.filtered().length === 1 && this.filtered()[0]);
          if (p) { this.add(p.id); inp.value = ''; this.renderGrid(); } else toast('لم يتم العثور على الصنف', 'warning');
        } else if (e.key === 'Escape') { inp.value = ''; this.renderGrid(); inp.blur(); }
      };
    }
  },

  renderCats() {
    const cats = [{ id: 'all', name: 'الكل', icon: 'fa-border-all' }].concat(DB.categories);
    $('#posCats').innerHTML = cats.map(c => `
      <button onclick="POS.setCat('${c.id}')" class="btn-active flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition ${this.cat === c.id ? 'bg-sky-500 text-white shadow-lg shadow-sky-500/30' : 'bg-slate-800/80 text-slate-300 border border-slate-700 hover:bg-slate-700'}">
        <i class="fa-solid ${c.icon}"></i>${esc(c.name)}</button>`).join('');
  },
  setCat(id) { this.cat = id; this.renderCats(); this.renderGrid(); },
  filtered() {
    const q = ($('#posSearch').value || '').trim().toLowerCase();
    return DB.products.filter(p => p.active && (this.cat === 'all' || p.catId === this.cat) &&
      (!q || p.name.toLowerCase().includes(q) || String(p.code).includes(q)));
  },
  renderGrid() {
    const list = this.filtered(), grid = $('#posGrid'), showImg = S().showImages;
    if (!list.length) { grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-500"><i class="fa-solid fa-box-open text-4xl mb-3"></i><p class="text-sm">لا توجد أصناف</p></div>`; return; }
    const inCart = {}; this.cur.items.forEach(i => inCart[i.pid] = (inCart[i.pid] || 0) + i.qty);
    grid.innerHTML = list.map(p => {
      const out = p.trackStock && p.stock <= 0;
      return `
      <div onclick="POS.add('${p.id}')" class="glass-card rounded-xl p-2.5 flex flex-col justify-between cursor-pointer relative overflow-hidden group min-h-[108px] ${out ? 'opacity-50' : ''}">
        <div class="absolute inset-0 bg-gradient-to-br ${p.color} opacity-40 group-hover:opacity-70 transition"></div>
        ${inCart[p.id] ? `<span class="absolute top-2 left-2 z-20 min-w-[22px] h-[22px] px-1 rounded-full bg-emerald-500 text-white text-xs font-bold flex items-center justify-center num shadow">${inCart[p.id]}</span>` : ''}
        <div class="relative z-10 flex items-start justify-between gap-2 mb-1.5">
          ${showImg && p.image ? `<img src="${p.image}" class="w-12 h-12 rounded-lg object-cover border border-white/10">` :
          `<span class="w-10 h-10 rounded-lg bg-slate-900/60 border border-white/10 text-sky-300 flex items-center justify-center text-lg group-hover:scale-110 transition"><i class="fa-solid ${p.icon}"></i></span>`}
          ${inCart[p.id] ? '' : `<span class="text-[10px] num text-slate-400 bg-slate-900/60 px-1.5 py-0.5 rounded border border-slate-800">${esc(p.code)}</span>`}
        </div>
        <div class="relative z-10">
          <h3 class="font-bold text-sm text-slate-50 line-clamp-2 leading-tight mb-1">${esc(p.name)}</h3>
          <div class="flex items-center justify-between">
            <span class="text-sm font-extrabold text-emerald-300 num">${money(p.price, false)} <span class="text-[10px] font-sans">${S().currency}</span></span>
            ${p.trackStock ? `<span class="text-[10px] ${p.stock <= S().lowStockAlert ? 'text-rose-300' : 'text-slate-400'}">م: ${p.stock}</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  },

  /* ---------- order panel ---------- */
  renderOrder() {
    const o = this.cur, c = calcOrder(o);
    $('#orderTypeTabs').innerHTML = Object.keys(TYPES).map(k => `
      <button onclick="POS.setType('${k}')" class="press flex items-center justify-center gap-1.5 py-1.5 rounded-lg text-xs font-bold transition ${o.type === k ? 'bg-sky-600 text-white shadow' : 'text-slate-400 hover:text-white'}"><i class="fa-solid ${TYPES[k].icon}"></i>${TYPES[k].name}</button>`).join('');

    let meta = '';

      <button onclick="POS.printPreBill()" title="طباعة الفاتورة الحالية (F6)" class="w-10 h-10 rounded-xl border bg-slate-800 border-slate-700 text-slate-300 hover:text-white"><i class="fa-solid fa-print"></i></button>
      <button onclick="POS.clear()" title="مسح الطلب (F2)" class="w-10 h-10 rounded-xl border bg-slate-800 border-slate-700 text-rose-300 hover:bg-rose-950/50"><i class="fa-solid fa-trash-can"></i></button>`;
    if (o.editInv) {
      const inv = DB.orders.find(x => x.id === o.editInv) || {};
      meta = `<div class="flex-1 min-w-0 px-3 py-2 rounded-xl border bg-amber-500/15 border-amber-500/40 text-amber-200 text-sm font-bold truncate"><i class="fa-solid fa-pen-to-square"></i> تعديل فاتورة #${inv.no} — ${esc(orderLabel(o))}</div>
        <button onclick="Inv.nav(-1)" title="الفاتورة الأحدث" class="w-10 h-10 rounded-xl border bg-slate-800 border-slate-700 text-slate-200"><i class="fa-solid fa-chevron-right"></i></button>
        <button onclick="Inv.nav(1)" title="الفاتورة الأقدم" class="w-10 h-10 rounded-xl border bg-slate-800 border-slate-700 text-slate-200"><i class="fa-solid fa-chevron-left"></i></button>
        <button onclick="Inv.cancelEdit()" title="إلغاء التعديل" class="w-10 h-10 rounded-xl border bg-slate-800 border-slate-700 text-rose-300"><i class="fa-solid fa-xmark"></i></button>`;
      $('#orderTypeTabs').innerHTML = '';
    }
    $('#orderMeta').innerHTML = meta;
    this.renderStrip();

    const box = $('#orderItems');
    if (!o.items.length) {
      box.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-500 gap-2 py-10">
        <i class="fa-solid fa-cart-flatbed text-5xl text-slate-700"></i><p class="text-sm">الطلب فارغ</p>
        <span class="text-[11px] text-slate-600">اختر الأصناف من القائمة لإضافتها</span>
        ${o.id ? `<span class="chip bg-indigo-500/15 text-indigo-300 border-indigo-500/30 mt-2">${esc(orderLabel(o))}</span>` : ''}</div>`;
    } else {
      box.innerHTML = (o.id ? `<div class="text-[11px] text-indigo-300 px-1 pb-1 flex justify-between"><span><i class="fa-solid fa-clock-rotate-left"></i> طلب محفوظ — ${esc(orderLabel(o))}</span><span class="text-slate-500">${since(o.createdAt)}</span></div>` : '') +
        o.items.map((it, idx) => `
        <div data-row="${idx}" onclick="POS.select(${idx})" ondblclick="POS.editItem(${idx})" ${idx === this.sel ? 'style="border-color:rgb(var(--ac-500));box-shadow:0 0 0 2px rgb(var(--ac-500)/.35)"' : ''} class="bg-slate-800/50 border ${it.sent >= it.qty ? 'border-slate-700/60' : 'border-sky-700/40'} rounded-xl p-2 flex items-center gap-2 hover:border-slate-600 transition">
          <div class="flex-1 min-w-0 cursor-pointer select-none" title="نقرة: تحديد الصنف لتعديل كميته بلوحة الأرقام — نقرتان: تعديل السعر والملاحظة">
            <h4 class="text-sm font-bold text-slate-100 truncate">${esc(it.name)} ${it.sent >= it.qty ? '<i class="fa-solid fa-fire-burner text-[10px] text-orange-400" title="أُرسل للمطبخ"></i>' : ''}</h4>
            ${it.note ? `<div class="text-[11px] text-amber-300 truncate"><i class="fa-solid fa-comment-dots"></i> ${esc(it.note)}</div>` : ''}
            <div class="text-[11px] text-slate-400 num">${money(it.price, false)} × ${it.qty} = <span class="text-emerald-400 font-bold">${money(it.price * it.qty)}</span></div>
          </div>
          <div class="flex items-center gap-1 bg-slate-900/80 rounded-lg p-1 border border-slate-700">
            <button onclick="POS.qty(${idx},-1)" class="w-7 h-7 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold">−</button>
            <span class="num text-sm font-bold text-sky-300 w-6 text-center">${it.qty}</span>
            <button onclick="POS.qty(${idx},1)" class="w-7 h-7 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold">+</button>
          </div>
          <button onclick="POS.remove(${idx})" class="text-slate-500 hover:text-rose-400 p-1"><i class="fa-solid fa-xmark"></i></button>
        </div>`).join('');
      box.scrollTop = box.scrollHeight;
    }

    const line = (k, v, cls = 'text-slate-200') => `<div class="flex justify-between text-slate-400"><span>${k}</span><span class="num font-semibold ${cls}">${v}</span></div>`;
    $('#orderTotals').innerHTML =
      line(`المجموع (${c.qty} صنف):`, money(c.subtotal)) +
      `<div class="flex justify-between items-center text-slate-400"><button onclick="POS.discount()" class="text-sky-400 hover:text-sky-300 font-bold"><i class="fa-solid fa-tag"></i> الخصم${o.discount.value ? (o.discount.type === 'pct' ? ` (${o.discount.value}%)` : '') : ' — إضافة'}</button><span class="num font-semibold text-emerald-400">${c.discountAmt ? money(c.discountAmt) : money(0)}</span></div>` +
      (c.service ? line(`الخدمة (${S().serviceRate}%):`, money(c.service)) : '') +
      (c.tax ? line(`الضريبة (${S().taxRate}%):`, money(c.tax)) : '') +
      (o.type === 'delivery' ? `<div class="flex justify-between text-slate-400"><button onclick="POS.editDelivery()" class="text-violet-300 font-bold"><i class="fa-solid fa-motorcycle"></i> رسوم التوصيل</button><span class="num font-semibold text-slate-200">${money(c.delivery)}</span></div>` : '') +
      `<div class="pt-2 mt-1 border-t border-slate-800 flex justify-between items-center"><span class="text-base font-bold text-slate-100">الإجمالي:</span><span class="text-2xl font-extrabold num text-emerald-400">${money(c.total)}</span></div>`;

    if (!$('#numpad').children.length) {
      const keys = ['7', '8', '9', 'C', '4', '5', '6', '+', '1', '2', '3', '−', '0', '⌫', 'DEL'];
      $('#numpad').innerHTML = keys.map(k => {
        const cls = k === 'C' ? 'bg-rose-950/50 hover:bg-rose-900 text-rose-300 border-rose-800/40' : (k === '+' || k === '−') ? 'bg-slate-800/80 text-sky-400 text-xl' : k === '⌫' ? 'text-amber-300' : k === 'DEL' ? 'bg-rose-950/50 hover:bg-rose-900 text-rose-300 border-rose-800/40 text-sm' : '';
        const title = k === 'C' ? 'إرجاع الكمية إلى 1' : k === 'DEL' ? 'حذف الصنف المحدد' : (k === '+' ? 'زيادة الكمية' : k === '−' ? 'إنقاص الكمية' : '');
        return `<button onclick="POS.numKey('${k}')" ${title ? `title="${title}"` : ''} class="numkey ${cls}${k === '0' ? ' col-span-2' : ''}">${k === 'DEL' ? '<i class="fa-solid fa-trash-can"></i>' : k}</button>`;
      }).join('');
    }
    this.updateTender();
    App.updateOpenBadge();
    document.body.classList.toggle('has-items', o.items.length > 0);
    $('#fabCount').textContent = '(' + c.qty + ')';
    $('#fabTotal').textContent = money(c.total);
  },
  updateTender() {
    $('#tendered').textContent = this.tendered || '0';
    const t = parseFloat(this.tendered), c = calcOrder(this.cur);
    if (this.lastChange && !this.cur.items.length && !t) {
      const L = this.lastChange;
      $('#changeDue').innerHTML = `<span class="text-slate-400">آخر فاتورة ${L.no}:</span> <b class="text-amber-300 text-sm">الباقي ${money(L.change)}</b> <button onclick="Printer.receipt(DB.orders.find(x=>x.id==='${L.id}'))" class="text-sky-300 underline mr-1">طباعة</button>`;
      return;
    }
    $('#changeDue').innerHTML = t && c.total ? (t >= c.total ? `الباقي: <b class="text-amber-300">${money(t - c.total)}</b>` : `<span class="text-rose-400">ناقص ${money(c.total - t)}</span>`) : '';
  },
  toggleCart(show) { document.body.classList.toggle('show-cart', !!show); },
  // لوحة الأرقام تُعدّل كمية الصنف المحدد في الطلب (آخر صنف أُضيف أو الذي لمسته)
  sel: null, qtyFresh: true,
  // تحديد الصنف دون إعادة بناء القائمة (حتى تعمل النقرة المزدوجة)
  select(idx) {
    if (this.sel === idx) return; this.sel = idx; this.qtyFresh = true;
    $$('#orderItems [data-row]').forEach(r => {
      const on = +r.dataset.row === idx;
      r.style.borderColor = on ? 'rgb(var(--ac-500))' : ''; r.style.boxShadow = on ? '0 0 0 2px rgb(var(--ac-500)/.35)' : '';
    });
  },
  async setQty(idx, v) {
    const it = this.cur.items[idx]; if (!it) return false;
    v = Math.max(1, Math.min(999, v));
    if (v < it.sent && this.cur.id) { if (!(await Perm.ask('voidSent', 'تقليل صنف أُرسل للمطبخ'))) return false; it.sent = Math.min(it.sent, v); logAct('تقليل صنف مرسل', it.name); }
    it.qty = v; this.renderOrder(); this.renderGrid(); return true;
  },
  async numKey(k) {
    const items = this.cur.items;
    if (!items.length) return;
    if (this.sel == null || this.sel >= items.length) { this.sel = items.length - 1; this.qtyFresh = true; }
    const idx = this.sel, it = items[idx];
    if (k === 'DEL') { this.sel = null; return this.remove(idx); }
    if (k === 'C') { this.qtyFresh = true; return this.setQty(idx, 1); }
    if (k === '+') { this.qtyFresh = true; return this.setQty(idx, it.qty + 1); }
    if (k === '−') { this.qtyFresh = true; return this.setQty(idx, it.qty - 1); }
    if (k === '⌫') { const v = Math.floor(it.qty / 10) || 1; this.qtyFresh = v === 1; return this.setQty(idx, v); }
    if (!/^[0-9]$/.test(k)) return;
    const d = parseInt(k, 10);
    const v = this.qtyFresh ? d : it.qty * 10 + d;
    if (v < 1) return;            // الصفر في البداية لا يغيّر شيئاً
    this.qtyFresh = false;
    return this.setQty(idx, v);
  },
  // إدخال المبلغ المدفوع (لحساب الباقي) — بعيداً عن لوحة الكميات
  tenderDialog() {
    const c = calcOrder(this.cur);
    const w = Modal.open(`<label class="lbl">المبلغ المدفوع من الزبون</label>
      <input class="inp num text-2xl text-center" type="number" min="0" step="any" inputmode="decimal" value="${this.tendered || ''}" placeholder="${c.total ? round(c.total) : ''}" data-t>
      <div class="flex flex-wrap gap-1.5 mt-3">${[['بالضبط', round(c.total)], ['5', 5], ['10', 10], ['20', 20], ['50', 50], ['100', 100]].map(x => `<button class="chip bg-slate-800 border-slate-700 text-slate-200 px-3 py-1.5" data-v="${x[1]}">${x[0]}</button>`).join('')}</div>
      <div class="flex gap-2 justify-end mt-5"><button class="btn-ghost" data-clear>مسح</button><button class="btn-ghost" data-close>إلغاء</button><button class="btn-primary" data-ok>حفظ</button></div>`, { title: 'المبلغ المدفوع', icon: 'fa-money-bill-wave', size: 'max-w-sm' });
    const inp = $('[data-t]', w); setTimeout(() => inp.focus(), 50);
    $$('[data-v]', w).forEach(b => b.onclick = () => { inp.value = b.dataset.v; });
    $('[data-clear]', w).onclick = () => { this.tendered = ''; this.updateTender(); Modal.close(); };
    const ok = () => { const v = parseFloat(inp.value); this.tendered = v > 0 ? String(v) : ''; this.updateTender(); Modal.close(); };
    $('[data-ok]', w).onclick = ok; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ok(); } };
  },

  setType(t) {
    if (this.cur.type === t) return;
    if (this.cur.id && this.cur.type === 'dine' && t !== 'dine') this.cur.tableId = null;
    this.cur.type = t;
    if (t === 'delivery' && !this.cur.deliveryFee) this.cur.deliveryFee = S().deliveryFee;
    this.renderOrder();
    if (t === 'dine' && !this.cur.tableId && this.cur.items.length) this.pickTable();
  },

  add(pid) {
    const p = DB.products.find(x => x.id === pid); if (!p) return;
    if (p.trackStock && p.stock - this.qtyInCart(pid) <= 0) toast(`تنبيه: مخزون "${p.name}" نفد`, 'warning');
    Inventory.warn(p, this.qtyInCart(pid) + 1);
    const ex = this.cur.items.find(i => i.pid === pid && !i.note && i.price === p.price);
    if (ex) { ex.qty++; this.sel = this.cur.items.indexOf(ex); }
    else { this.cur.items.push({ pid, name: p.name, price: p.price, cost: unitCost(p), qty: 1, note: '', sent: 0, kitchen: p.kitchen !== false }); this.sel = this.cur.items.length - 1; }
    this.qtyFresh = true;
    beep(); this.renderOrder(); this.renderGrid();
  },
  qtyInCart(pid) { return this.cur.items.filter(i => i.pid === pid).reduce((a, i) => a + i.qty, 0); },
  async qty(idx, d) {
    const it = this.cur.items[idx]; if (!it) return;
    if (d < 0 && it.sent >= it.qty && this.cur.id) { if (!(await Perm.ask('voidSent', 'تقليل صنف أُرسل للمطبخ'))) return; it.sent = Math.max(0, it.sent - 1); logAct('تقليل صنف مرسل', it.name); }
    it.qty += d;
    if (it.qty <= 0) this.cur.items.splice(idx, 1);
    this.renderOrder(); this.renderGrid();
  },
  async remove(idx) {
    const it = this.cur.items[idx]; if (!it) return;
    if (it.sent > 0 && this.cur.id) { if (!(await Perm.ask('voidSent', 'حذف صنف أُرسل للمطبخ'))) return; logAct('حذف صنف مرسل', it.name + ' × ' + it.qty); }
    this.cur.items.splice(idx, 1); this.renderOrder(); this.renderGrid();
  },
  editItem(idx) {
    const it = this.cur.items[idx];
    const w = Modal.open(`
      <div class="grid grid-cols-2 gap-3">
        <div><label class="lbl">الكمية</label><input class="inp num text-lg" type="number" min="1" step="1" value="${it.qty}" data-q></div>
        <div><label class="lbl">السعر ${Perm.can('editPrice') ? '' : '(يتطلب المدير)'}</label><input class="inp num text-lg" type="number" step="any" value="${it.price}" data-p></div>
      </div>
      <label class="lbl mt-3">ملاحظة للمطبخ</label>
      <input class="inp" value="${esc(it.note)}" placeholder="مثال: بدون بصل، سكر خفيف..." data-n>
      <div class="flex items-center justify-between mt-3"><span class="text-xs text-slate-400">ملاحظات جاهزة</span><button class="text-xs text-sky-400 hover:text-sky-300" data-manage></button></div>
      <div class="flex flex-wrap gap-1.5 mt-1.5" data-tags></div>
      <div class="flex gap-2 justify-end mt-5"><button class="btn-ghost" data-close>إلغاء</button><button class="btn-primary" data-ok>حفظ</button></div>`,
      { title: it.name, icon: 'fa-pen-to-square', size: 'max-w-md' });
    let manage = false;
    const presets = () => { const st = S(); if (!Array.isArray(st.notePresets)) st.notePresets = ['بدون سكر', 'سكر خفيف', 'بدون بصل', 'حار', 'بدون مايونيز', 'إضافي جبن', 'مثلج', 'تيك أوي']; return st.notePresets; };
    const paintTags = () => {
      const box = $('[data-tags]', w), list = presets();
      $('[data-manage]', w).innerHTML = manage ? '<i class="fa-solid fa-check"></i> تم' : '<i class="fa-solid fa-pen"></i> تعديل الجاهز';
      box.innerHTML = list.map((t, i) => manage
        ? `<span class="chip bg-slate-800 border-slate-700 text-slate-200 inline-flex items-center gap-2"><button data-ren="${i}" title="تعديل">${esc(t)} <i class="fa-solid fa-pen text-[10px] text-sky-400"></i></button><button data-del="${i}" title="حذف" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-xmark"></i></button></span>`
        : `<button class="chip bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700" data-tag="${i}">${esc(t)}</button>`).join('')
        + (manage ? '<button class="chip bg-sky-900/40 border-sky-700 text-sky-300" data-add><i class="fa-solid fa-plus"></i> إضافة</button>' : '');
      $$('[data-tag]', box).forEach(b => b.onclick = () => { const t = presets()[+b.dataset.tag], n = $('[data-n]', w); n.value = n.value ? n.value + '، ' + t : t; });
      $$('[data-del]', box).forEach(b => b.onclick = () => { presets().splice(+b.dataset.del, 1); Store.save(); paintTags(); });
      $$('[data-ren]', box).forEach(b => b.onclick = async () => { const i = +b.dataset.ren, v = await promptBox('تعديل الملاحظة', { value: presets()[i] }); if (v && v.trim()) { presets()[i] = v.trim(); Store.save(); } paintTags(); });
      const add = $('[data-add]', box);
      if (add) add.onclick = async () => { const v = await promptBox('ملاحظة جاهزة جديدة', { value: '' }); if (v && v.trim()) { presets().push(v.trim()); Store.save(); } paintTags(); };
    };
    $('[data-manage]', w).onclick = () => { manage = !manage; paintTags(); };
    paintTags();
    $('[data-ok]', w).onclick = async () => {
      const q = Math.max(1, parseInt($('[data-q]', w).value) || 1), p = parseFloat($('[data-p]', w).value);
      const note = $('[data-n]', w).value.trim();
      if (!isNaN(p) && p !== it.price) {
        if (!(await Perm.ask('editPrice', 'تعديل سعر صنف'))) return;
        logAct('تعديل سعر', `${it.name}: ${it.price} → ${p}`); it.price = p;
      }
      if (q < it.sent && this.cur.id && !(await Perm.ask('voidSent', 'تقليل صنف أُرسل للمطبخ'))) return;
      if (q < it.sent) it.sent = q;
      if (note !== it.note) { it.note = note; if (it.sent) { it.sent = 0; } }
      it.qty = q; Modal.closeAll(); this.renderOrder(); this.renderGrid();
    };
  },
  async discount() {
    if (!this.cur.items.length) return toast('أضف أصنافاً أولاً', 'warning');
    const d = this.cur.discount;
    const w = Modal.open(`
      <div class="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-xl mb-3">
        <button class="py-2 rounded-lg text-sm font-bold" data-t="pct">نسبة %</button><button class="py-2 rounded-lg text-sm font-bold" data-t="amt">مبلغ ثابت</button></div>
      <input class="inp text-2xl num text-center" type="number" step="any" value="${d.value || ''}" data-v placeholder="0">
      <div class="grid grid-cols-4 gap-2 mt-3">${[5, 10, 15, 20, 25, 30, 50, 100].map(v => `<button class="btn-ghost py-1.5" data-q="${v}">${v}</button>`).join('')}</div>
      <div class="flex gap-2 justify-between mt-5"><button class="btn-ghost text-rose-300" data-rm>إزالة الخصم</button><div class="flex gap-2"><button class="btn-ghost" data-close>إلغاء</button><button class="btn-primary" data-ok>تطبيق</button></div></div>`,
      { title: 'خصم على الفاتورة', icon: 'fa-tag', size: 'max-w-sm' });
    let type = d.type || 'pct';
    const paint = () => $$('[data-t]', w).forEach(b => b.className = 'py-2 rounded-lg text-sm font-bold ' + (b.dataset.t === type ? 'bg-sky-600 text-white' : 'text-slate-400'));
    paint();
    $$('[data-t]', w).forEach(b => b.onclick = () => { type = b.dataset.t; paint(); });
    $$('[data-q]', w).forEach(b => b.onclick = () => $('[data-v]', w).value = b.dataset.q);
    $('[data-rm]', w).onclick = () => { this.cur.discount = { type: 'pct', value: 0 }; Modal.close(); this.renderOrder(); };
    const apply = async () => {
      const v = Math.max(0, parseFloat($('[data-v]', w).value) || 0);
      if (type === 'pct' && v > 100) return toast('النسبة لا تتجاوز 100%', 'error');
      Modal.close();
      if (v > 0 && !(await Perm.ask('discount', 'تطبيق خصم'))) return;
      this.cur.discount = { type, value: v }; logAct('خصم', type === 'pct' ? v + '%' : money(v)); this.renderOrder();
    };
    $('[data-ok]', w).onclick = apply; $('[data-v]', w).onkeydown = e => e.key === 'Enter' && apply();
  },
  async editDelivery() {
    const v = await promptBox('رسوم التوصيل', { value: this.cur.deliveryFee, type: 'number' });
    if (v !== null) { this.cur.deliveryFee = Math.max(0, parseFloat(v) || 0); this.renderOrder(); }
  },
  async editNote() {
    const v = await promptBox('ملاحظة على الطلب', { value: this.cur.note, placeholder: 'تظهر في تذكرة المطبخ والفاتورة' });
    if (v !== null) { this.cur.note = v.trim(); this.renderOrder(); }
  },
  editCustomer() {
    const c = this.cur.customer;
    const w = Modal.open(`
      <div class="space-y-3">
        <div><label class="lbl">رقم الهاتف</label><input class="inp num" inputmode="tel" value="${esc(c.phone)}" data-ph placeholder="09xxxxxxxx"><div data-sug class="mt-1"></div></div>
        <div><label class="lbl">اسم الزبون</label><input class="inp" value="${esc(c.name)}" data-nm></div>
        <div><label class="lbl">العنوان ${this.cur.type === 'delivery' ? '' : '(للتوصيل)'}</label><textarea class="inp" rows="2" data-ad>${esc(c.address)}</textarea></div>
      </div>
      <div class="flex gap-2 justify-end mt-5"><button class="btn-ghost" data-close>إلغاء</button><button class="btn-primary" data-ok>حفظ</button></div>`,
      { title: 'بيانات الزبون', icon: 'fa-user', size: 'max-w-md' });
    const ph = $('[data-ph]', w);
    ph.oninput = () => {
      const q = ph.value.trim(); if (q.length < 3) return $('[data-sug]', w).innerHTML = '';
      const seen = {}, list = [];
      for (const o of DB.orders) { if (o.customer && o.customer.phone && o.customer.phone.includes(q) && !seen[o.customer.phone]) { seen[o.customer.phone] = 1; list.push(o.customer); if (list.length > 4) break; } }
      $('[data-sug]', w).innerHTML = list.map((x, i) => `<button class="chip bg-violet-500/15 border-violet-500/30 text-violet-200 ml-1 mb-1" data-i="${i}">${esc(x.phone)} — ${esc(x.name)}</button>`).join('');
      $$('[data-i]', w).forEach(b => b.onclick = () => { const x = list[b.dataset.i]; ph.value = x.phone; $('[data-nm]', w).value = x.name; $('[data-ad]', w).value = x.address || ''; $('[data-sug]', w).innerHTML = ''; });
    };
    $('[data-ok]', w).onclick = () => { this.cur.customer = { phone: ph.value.trim(), name: $('[data-nm]', w).value.trim(), address: $('[data-ad]', w).value.trim() }; Modal.close(); this.renderOrder(); };
  },

  pickTable(cb) {
    const zones = [...new Set(DB.tables.map(t => t.zone || 'الصالة'))];
    const busy = {}; DB.open.forEach(o => { if (o.type === 'dine' && o.tableId) busy[o.tableId] = o; });
    const w = Modal.open(zones.map(z => `
      <h4 class="text-xs font-bold text-slate-400 mb-2 mt-1">${esc(z)}</h4>
      <div class="grid grid-cols-4 sm:grid-cols-6 gap-2 mb-3">${DB.tables.filter(t => (t.zone || 'الصالة') === z).map(t => {
      const b = busy[t.id], mine = (this.cur.id && b && b.id === this.cur.id) || (!this.cur.id && this.cur.items.length && this.cur.tableId === t.id);
      return `<button data-t="${t.id}" class="press aspect-square rounded-xl border flex flex-col items-center justify-center gap-0.5 ${mine ? 'bg-sky-600 border-sky-400 text-white' : b ? 'bg-rose-500/15 border-rose-500/40 text-rose-200' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200 hover:bg-emerald-500/20'}">
          <i class="fa-solid fa-chair text-sm"></i><span class="font-extrabold text-lg leading-none">${esc(t.name)}</span>${b && !mine ? `<span class="text-[9px] num">${money(calcOrder(b).total, false)}</span>` : ''}</button>`;
    }).join('')}</div>`).join('') + `<p class="text-[11px] text-slate-500">الأخضر: متاحة — الأحمر: مشغولة (اضغط لفتح طلبها)</p>`,
      { title: 'اختيار الطاولة', icon: 'fa-chair', size: 'max-w-2xl' });
    $$('[data-t]', w).forEach(b => b.onclick = () => {
      const tid = b.dataset.t, other = busy[tid];
      Modal.close();
      if (other && (!this.cur.id || other.id !== this.cur.id)) {
        if (this.cur.items.length && !this.cur.id) return toast('هذه الطاولة مشغولة. احفظ الطلب الحالي على طاولة أخرى أو امسحه', 'warning');
        return this.load(other.id);
      }
      if (this.cur.id && this.cur.tableId && this.cur.tableId !== tid) { logAct('نقل طاولة', tableName(this.cur.tableId) + ' → ' + tableName(tid)); toast(`تم نقل الطلب إلى طاولة ${tableName(tid)}`, 'success'); }
      this.cur.tableId = tid; this.cur.type = 'dine';
      if (this.cur.id) { const o = DB.open.find(x => x.id === this.cur.id); if (o) { o.tableId = tid; o.type = 'dine'; Store.save(); } }
      this.renderOrder(); if (cb) cb();
    });
  },

  /* ---------- lifecycle ---------- */
  newOrder() {
    if (this.cur && this.cur.items.length && !this.cur.id) {
      return confirmBox('الطلب الحالي غير محفوظ. هل تريد تجاهله وفتح طلب جديد؟', { ok: 'نعم، طلب جديد', danger: true }).then(ok => { if (ok) { this.cur = this.blank(); this.tendered = ''; this.sel = null; this.render(); } });
    }
    this.cur = this.blank(); this.tendered = ''; this.sel = null; this.render();
  },
  async clear() {
    if (this.cur.editInv) return Inv.cancelEdit();
    if (!this.cur.items.length && !this.cur.id) return;
    if (this.cur.id) {
      if (!(await confirmBox(`إلغاء الطلب المحفوظ (${esc(orderLabel(this.cur))}) بالكامل؟`, { ok: 'إلغاء الطلب', danger: true }))) return;
      if (this.cur.items.some(i => i.sent) && !(await Perm.ask('cancelOrder', 'إلغاء طلب أُرسل للمطبخ'))) return;
      DB.open = DB.open.filter(o => o.id !== this.cur.id);
      logAct('إلغاء طلب مفتوح', orderLabel(this.cur) + ' — ' + money(calcOrder(this.cur).total));
      Store.save();
    }
    this.cur = this.blank(); this.tendered = ''; this.sel = null; this.render(); toast('تم مسح الطلب', 'warning');
  },
  load(id) {
    const o = DB.open.find(x => x.id === id); if (!o) return;
    this.cur = clone(o); this.tendered = ''; this.sel = null;
    if (App.view !== 'pos') App.go('pos'); else this.render();
  },
  /** Save (hold) order + send unsent items to kitchen */
  hold(silent) {
    if (this.cur.editInv) return toast('أنت في وضع تعديل فاتورة — اختر طريقة الدفع لحفظ التعديل', 'warning');
    if (isQuick()) return toast('حفظ الطلبات غير متاح في وضع البيع الفوري', 'warning');
    const o = this.cur;
    if (!o.items.length) return toast('لا توجد أصناف لحفظها', 'error');
    if (!Shift.ensure()) return;
    if (o.type === 'dine' && !o.tableId) return this.pickTable(() => this.hold(silent));
    if (!o.id) { o.id = uid(); o.createdAt = Date.now(); o.userName = App.user.name; o.dailyNo = nextDailyNo(); }
    this.sendKitchen(o);
    const i = DB.open.findIndex(x => x.id === o.id);
    if (i >= 0) DB.open[i] = clone(o); else DB.open.push(clone(o));
    Store.save();
    toast(`تم حفظ الطلب — ${orderLabel(o)}`, 'success'); this.toggleCart(false);
    this.cur = this.blank(o.type); this.tendered = ''; this.sel = null; this.render();
  },
  sendKitchen(o) {
    const items = o.items.filter(i => i.qty > i.sent && i.kitchen !== false).map(i => ({ name: i.name, qty: i.qty - i.sent, note: i.note }));
    o.items.forEach(i => i.sent = i.qty);
    if (!items.length || (isQuick() && !S().kitchenPrint)) return;
    const t = { id: uid(), orderId: o.id, label: orderLabel(o), type: o.type, dailyNo: o.dailyNo, items, note: o.note, at: Date.now(), done: false, user: App.user.name };
    DB.tickets.unshift(t); if (DB.tickets.length > 500) DB.tickets.length = 500;
    if (S().kitchenPrint) Printer.kitchen(t);
  },
  printPreBill() {
    if (!this.cur.items.length) return toast('الطلب فارغ', 'error');
    Printer.receipt(Object.assign({}, this.cur, calcOrder(this.cur), { no: '—', date: Date.now(), pre: true, userName: App.user.name, pay: { cash: 0, card: 0 } }));
  },

  /* ---------- Payment ---------- */
  async pay(method) {
    const o = this.cur;
    if (o.editInv) return Inv.saveEdit(method);
    if (!o.items.length) return toast('الفاتورة فارغة! أضف أصنافاً أولاً', 'error');
    if (!Shift.ensure()) return;
    if (o.type === 'dine' && !o.tableId && DB.tables.length) return this.pickTable(() => this.pay(method));
    const c = calcOrder(o);
    let pay = { cash: 0, card: 0 }, tendered = 0, change = 0;
    if (method === 'cash') {
      tendered = parseFloat(this.tendered) || c.total;
      if (tendered < c.total) return toast(`المبلغ المدفوع أقل من الإجمالي (${money(c.total)})`, 'error');
      pay.cash = c.total; change = round(tendered - c.total);
    } else if (method === 'card') {
      pay.card = c.total;
    } else {
      const r = await this.splitDialog(c.total); if (!r) return;
      pay = r.pay; tendered = r.tendered; change = r.change;
    }
    this.finalize(o, c, pay, tendered, change);
  },
  splitDialog(total) {
    return new Promise(res => {
      let done = false;
      const w = Modal.open(`
        <div class="text-center mb-4"><span class="text-slate-400 text-sm">الإجمالي المطلوب</span><div class="text-3xl font-extrabold num text-emerald-400">${money(total)}</div></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="lbl"><i class="fa-solid fa-credit-card text-sky-400"></i> بطاقة</label><input class="inp num text-lg" type="number" step="any" value="" data-card autofocus></div>
          <div><label class="lbl"><i class="fa-solid fa-money-bill text-emerald-400"></i> نقدي (المستلم)</label><input class="inp num text-lg" type="number" step="any" value="" data-cash></div>
        </div>
        <div class="text-sm mt-3 text-center" data-st></div>
        <div class="flex gap-2 justify-end mt-5"><button class="btn-ghost" data-close>إلغاء</button><button class="btn-success" data-ok>إتمام الدفع</button></div>`,
        { title: 'دفع مختلط', icon: 'fa-code-branch', size: 'max-w-md', onClose: () => { if (!done) res(null); } });
      const ci = $('[data-card]', w), ca = $('[data-cash]', w);
      const st = () => {
        const card = Math.min(+ci.value || 0, total), cash = +ca.value || 0, rest = round(total - card);
        $('[data-st]', w).innerHTML = cash >= rest ? `الباقي للزبون: <b class="num text-amber-300">${money(cash - rest)}</b>` : `المتبقي نقداً: <b class="num text-rose-400">${money(rest - cash)}</b>`;
        return { card, cash, rest };
      };
      ci.oninput = () => { ca.value = round(Math.max(0, total - (+ci.value || 0))); st(); }; ca.oninput = st; st();
      $('[data-ok]', w).onclick = () => {
        const { card, cash, rest } = st();
        if (card + cash < total - 0.0001) return toast('المبلغ غير مكتمل', 'error');
        done = true; Modal.close();
        res({ pay: { card: round(card), cash: rest }, tendered: cash, change: round(cash - rest) });
      };
    });
  },
  finalize(o, c, pay, tendered, change, by) {
    const sh = Shift.current(), s = S();
    if (!o.id) { o.id = uid(); o.createdAt = Date.now(); o.dailyNo = nextDailyNo(); o.userName = App.user.name; }
    this.sendKitchen(o); // anything not yet sent
    const inv = {
      id: o.id, no: s.nextInvoice++, dailyNo: o.dailyNo, date: Date.now(), openedAt: o.createdAt, type: o.type, tableId: o.tableId,
      tableName: o.tableId ? tableName(o.tableId) : '', items: o.items.map(i => ({ pid: i.pid, name: i.name, price: i.price, cost: i.cost || 0, qty: i.qty, note: i.note })),
      discount: o.discount, customer: o.customer, note: o.note,
      subtotal: c.subtotal, discountAmt: c.discountAmt, service: c.service, tax: c.tax, delivery: c.delivery, total: c.total,
      pay, tendered, change, method: pay.card && pay.cash ? 'split' : pay.card ? 'card' : 'cash',
      userId: by ? by.id : App.user.id, userName: by ? by.name : App.user.name, shiftId: sh ? sh.id : null, status: 'paid'
    };
    delete o.billReq; delete o.payReq;
    DB.orders.push(inv);
    DB.open = DB.open.filter(x => x.id !== o.id);
    // stock
    inv.items.forEach(i => { const p = DB.products.find(x => x.id === i.pid); if (p && p.trackStock) p.stock = round(p.stock - i.qty); });
    inv.mats = Inventory.consume(inv.items);
    logAct('فاتورة', '#' + inv.no + ' — ' + money(inv.total));
    Store.saveNow();
    if (s.autoPrint) Printer.receipt(inv);
    if (by) { beep(1320, .08); toast(`دفع من النادل ${by.name} — ${orderLabel(o)} — ${money(inv.total)}`, 'success'); App.refresh(); return inv; }
    this.cur = this.blank(o.type); this.tendered = ''; this.sel = null; this.toggleCart(false); this.render();
    beep(1320, .08);
    if (isQuick() && !S().quickPopup) {
      this.lastChange = inv;
      this.updateTender();
      toast(inv.change ? `تم الدفع ✓ — الباقي للزبون: ${money(inv.change)}` : `تم الدفع ✓ — فاتورة ${inv.no}`, 'success');
    } else this.successModal(inv);
  },
  successModal(inv) {
    const w = Modal.open(`
      <div class="text-center">
        <div class="w-16 h-16 mx-auto rounded-full bg-emerald-500/15 border border-emerald-500/40 flex items-center justify-center mb-3"><i class="fa-solid fa-check text-3xl text-emerald-400"></i></div>
        <h3 class="text-xl font-bold mb-1">تم الدفع بنجاح</h3>
        <p class="text-slate-400 text-sm mb-4">فاتورة رقم <b class="num text-sky-300">${inv.no}</b> — رقم الطلب <b class="num text-sky-300">${inv.dailyNo}</b></p>
        <div class="grid grid-cols-2 gap-2 text-sm mb-4">
          <div class="card p-3"><div class="text-slate-400 text-xs">الإجمالي</div><div class="num font-bold text-lg text-emerald-400">${money(inv.total)}</div></div>
          <div class="card p-3"><div class="text-slate-400 text-xs">الباقي للزبون</div><div class="num font-bold text-2xl text-amber-300">${money(inv.change)}</div></div>
        </div>
        <div class="flex gap-2"><button class="btn-ghost flex-1" data-p><i class="fa-solid fa-print"></i> طباعة الفاتورة</button><button class="btn-primary flex-1" data-close autofocus>طلب جديد (Enter)</button></div>
      </div>`, { size: 'max-w-sm' });
    $('[data-p]', w).onclick = () => Printer.receipt(inv);
    $('[data-close]', w).onclick = () => Modal.close();
    $('[data-close]', w).onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); Modal.close(); } };
  },

  openSearch() {
    if (App.view !== 'pos') App.go('pos');
    const w = Modal.open(`<input class="inp text-base" placeholder="اكتب اسم الصنف أو الكود..." data-q autofocus><div class="mt-3 space-y-1.5 max-h-[55vh] overflow-y-auto" data-r></div>`,
      { title: 'البحث السريع عن الأصناف', icon: 'fa-magnifying-glass', size: 'max-w-lg' });
    let sel = 0, list = [];
    const draw = () => {
      const q = $('[data-q]', w).value.trim().toLowerCase();
      list = DB.products.filter(p => p.active && (!q || p.name.toLowerCase().includes(q) || String(p.code).includes(q))).slice(0, 40);
      sel = Math.min(sel, Math.max(0, list.length - 1));
      $('[data-r]', w).innerHTML = list.map((p, i) => `<div data-i="${i}" class="p-2.5 rounded-xl border flex justify-between items-center cursor-pointer ${i === sel ? 'bg-sky-600/30 border-sky-500/60' : 'bg-slate-800 border-slate-700 hover:bg-slate-700'}">
        <div class="flex items-center gap-2.5"><i class="fa-solid ${p.icon} text-sky-400 w-5"></i><div><div class="text-sm font-bold">${esc(p.name)}</div><div class="text-[10px] text-slate-400 num">${esc(p.code)}</div></div></div>
        <span class="num font-bold text-emerald-400">${money(p.price)}</span></div>`).join('') || '<p class="text-center text-slate-500 py-6">لا نتائج</p>';
      $$('[data-i]', w).forEach(d => d.onclick = () => { this.add(list[d.dataset.i].id); Modal.close(); });
    };
    $('[data-q]', w).oninput = () => { sel = 0; draw(); };
    $('[data-q]', w).onkeydown = e => {
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, list.length - 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === 'Enter' && list[sel]) { this.add(list[sel].id); Modal.close(); }
    };
    draw();
  }
};

/* 04-views.js */
/* =====================================================================
   Views: tables, kitchen, invoices, expenses, reports
   ===================================================================== */
function pageHead(title, icon, actions = '') {
  return `<div class="flex items-center justify-between gap-3 mb-4 flex-wrap"><h2 class="text-xl font-extrabold flex items-center gap-2"><span class="w-9 h-9 rounded-xl bg-sky-500/15 border border-sky-500/30 text-sky-300 flex items-center justify-center"><i class="fa-solid ${icon}"></i></span>${title}</h2><div class="flex gap-2 flex-wrap">${actions}</div></div>`;
}
function kpi(label, value, icon, color = 'text-sky-300', sub = '') {
  return `<div class="card p-4 flex items-center gap-3"><span class="w-11 h-11 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center ${color}"><i class="fa-solid ${icon} text-lg"></i></span>
    <div class="min-w-0"><div class="text-xs text-slate-400">${label}</div><div class="text-lg font-extrabold num ${color} truncate">${value}</div>${sub ? `<div class="text-[10px] text-slate-500">${sub}</div>` : ''}</div></div>`;
}

/* ---------------- Tables ---------------- */
function busyTables() {
  const busy = {}; DB.open.forEach(o => { if (o.type === 'dine' && o.tableId) busy[o.tableId] = o; });
  const c = POS.cur; // الطلب الحالي غير المحفوظ يُعتبر طاولة مشغولة أيضًا
  if (c && !c.id && c.type === 'dine' && c.tableId && c.items.length && !busy[c.tableId]) busy[c.tableId] = Object.assign({}, c, { _draft: true });
  return busy;
}
VIEWS.tables = (el) => {
  const busy = busyTables();
  const zones = [...new Set(DB.tables.map(t => t.zone || 'الصالة'))];
  const others = DB.open.filter(o => o.type !== 'dine' || !o.tableId);
  const occ = Object.keys(busy).length;
  el.innerHTML = pageHead('الطاولات والطلبات المفتوحة', 'fa-chair',
    `<span class="chip bg-emerald-500/15 text-emerald-300 border-emerald-500/30">متاحة: ${DB.tables.length - occ}</span>
     <span class="chip bg-rose-500/15 text-rose-300 border-rose-500/30">مشغولة: ${occ}</span>
     ${Perm.can('settings') ? `<button class="btn-ghost text-xs" onclick="App.go('settings');setTimeout(()=>$('#setTables')&&$('#setTables').scrollIntoView(),50)"><i class="fa-solid fa-gear"></i> إدارة الطاولات</button>` : ''}`) +
    zones.map(z => `<h3 class="text-sm font-bold text-slate-400 mb-2 mt-2">${esc(z)}</h3>
      <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-8 gap-3 mb-5">${DB.tables.filter(t => (t.zone || 'الصالة') === z).map(t => {
      const o = busy[t.id];
      if (!o) return `<button onclick="POS.newOrderOnTable('${t.id}')" class="press glass-card rounded-2xl p-3 aspect-[4/3] flex flex-col items-center justify-center gap-1 border-emerald-500/20">
          <i class="fa-solid fa-chair text-emerald-400 text-xl"></i><span class="text-2xl font-extrabold">${esc(t.name)}</span><span class="text-[10px] text-emerald-400">متاحة</span></button>`;
      const c = calcOrder(o);
      if (o._draft) return `<button onclick="App.go('pos')" class="press tbl-busy rounded-2xl p-3 aspect-[4/3] flex flex-col items-center justify-center gap-0.5 transition">
          <span class="text-2xl font-extrabold">${esc(t.name)}</span><span class="num font-bold text-sm">${money(c.total)}</span>

POS.splitBill = async function () {

  };
  $$('[data-m]', w).forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });

/* ---------------- Date range helper ---------------- */
const Range = {
  preset: 'today', from: dayKey(Date.now()), to: dayKey(Date.now()),
  set(p) {
    const d = new Date(); let f = new Date(d), t = new Date(d);
    if (p === 'yesterday') { f.setDate(d.getDate() - 1); t = new Date(f); }
    else if (p === 'week') f.setDate(d.getDate() - 6);
    else if (p === 'month') f = new Date(d.getFullYear(), d.getMonth(), 1);
    else if (p === 'lastmonth') { f = new Date(d.getFullYear(), d.getMonth() - 1, 1); t = new Date(d.getFullYear(), d.getMonth(), 0); }
    else if (p === 'year') f = new Date(d.getFullYear(), 0, 1);
    if (p !== 'custom') { this.from = dayKey(f); this.to = dayKey(t); }
    this.preset = p;
  },
  bounds() { const a = new Date(this.from + 'T00:00:00').getTime(), b = new Date(this.to + 'T23:59:59.999').getTime(); return [a, b]; },
  html(cb) {
    const ps = { today: 'اليوم', yesterday: 'أمس', week: '7 أيام', month: 'هذا الشهر', lastmonth: 'الشهر الماضي', year: 'هذه السنة' };
    return `<div class="flex flex-wrap items-center gap-1.5">${Object.keys(ps).map(k => `<button onclick="Range.set('${k}');${cb}" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${this.preset === k ? 'bg-sky-600 border-sky-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'}">${ps[k]}</button>`).join('')}
      <input type="date" value="${this.from}" onchange="Range.from=this.value;Range.preset='custom';${cb}" class="inp w-auto py-1 text-xs num">
      <span class="text-slate-500 text-xs">إلى</span>
      <input type="date" value="${this.to}" onchange="Range.to=this.value;Range.preset='custom';${cb}" class="inp w-auto py-1 text-xs num"></div>`;
  }
};
