function bars(rows, color = 'bg-sky-500', fmt = (v) => money(v)) {
  const max = Math.max(1, ...rows.map(r => r[1]));
  return rows.length ? rows.map(r => `<div class="flex items-center gap-2 text-xs mb-1.5"><span class="w-28 truncate text-slate-300">${esc(r[0])}</span>
    <div class="flex-1 bg-slate-800 rounded-full h-2.5 overflow-hidden"><div class="${color} h-full rounded-full" style="width:${(r[1] / max * 100).toFixed(1)}%"></div></div>
    <span class="num w-24 text-left text-slate-200 font-bold">${fmt(r[1])}</span></div>`).join('') : '<p class="text-slate-500 text-xs">لا توجد بيانات</p>';
}
function reportData() {
  const [a, b] = Range.bounds();
  const all = DB.orders.filter(o => o.date >= a && o.date <= b), paid = all.filter(o => o.status === 'paid');
  const sum = (arr, f) => arr.reduce((s, o) => s + f(o), 0);
  const prod = {}, cat = {}, hour = Array(24).fill(0), byUser = {}, byType = {}, byDay = {};
  let cost = 0;
  paid.forEach(o => {
    o.items.forEach(i => {
      const p = DB.products.find(x => x.id === i.pid);
      const k = i.name; prod[k] = prod[k] || { qty: 0, total: 0 }; prod[k].qty += i.qty; prod[k].total += i.price * i.qty;
      const cn = p ? ((DB.categories.find(c => c.id === p.catId) || {}).name || 'أخرى') : 'أخرى'; cat[cn] = (cat[cn] || 0) + i.price * i.qty;
      cost += (i.cost || 0) * i.qty;
    });
    hour[new Date(o.date).getHours()] += o.total;
    byUser[o.userName] = (byUser[o.userName] || 0) + o.total;
    byType[TYPES[o.type].name] = (byType[TYPES[o.type].name] || 0) + o.total;
    const dk = dayKey(o.date); byDay[dk] = (byDay[dk] || 0) + o.total;
  });
  // المصروفات الناتجة عن فواتير الشراء تُحتسب ضمن «المشتريات» فقط حتى لا تُخصم مرتين
  const exps = DB.expenses.filter(e => e.date >= a && e.date <= b && !e.purchaseId && !(e.cat === 'مشتريات مطبخ' && String(e.desc || '').startsWith('شراء مواد خام')));
  const purs = DB.purchases.filter(x => x.date >= a && x.date <= b), purMat = {};
  purs.forEach(x => x.lines.forEach(l => { const k = l.name + '|' + l.unit, o = purMat[k] = purMat[k] || { name: l.name, unit: l.unit, qty: 0, total: 0 }; o.qty += l.qty; o.total += l.qty * l.price; }));
  const sales = sum(paid, o => o.total), netSales = sum(paid, o => o.total - o.tax - o.delivery);
  return {
    all, paid, sales, count: paid.length, avg: paid.length ? sales / paid.length : 0,
    discount: sum(paid, o => o.discountAmt), service: sum(paid, o => o.service), tax: sum(paid, o => o.tax), delivery: sum(paid, o => o.delivery),
    cash: sum(paid, o => o.pay.cash), card: sum(paid, o => o.pay.card), voids: all.filter(o => o.status !== 'paid'),
    expenses: sum(exps, e => e.amount), expCats: exps.reduce((m, e) => (m[e.cat || 'أخرى'] = (m[e.cat || 'أخرى'] || 0) + e.amount, m), {}),
    purchases: sum(purs, x => x.total), purCount: purs.length, purMat: Object.values(purMat).sort((x, y) => y.total - x.total),
    cost, netSales, profit: netSales - cost, net: netSales - sum(purs, x => x.total) - sum(exps, e => e.amount), prod, cat, hour, byUser, byType, byDay
  };
}
VIEWS.reports = (el) => {

/* =====================================================================
   Docs: طباعة وتصدير التقارير والجداول — A4 / حراري / Word (.docx) / Excel (CSV)
   كل صفحة تبني «مواصفة» (عنوان + مؤشرات + جداول) ثم يخرجها هذا القسم بالشكل المطلوب
   ===================================================================== */
const Docs = {
  fname(spec) { return (spec.file || spec.title).replace(/[\\/:*?"<>|]+/g, ' ').trim() + '_' + dayKey(Date.now()); },
  invList() {
    const [a, b] = Range.bounds(), q = Inv.q.trim().toLowerCase();
    let list = DB.orders.filter(o => o.date >= a && o.date <= b);
    if (!Perm.can('allInvoices')) { const sh = Shift.current(); list = list.filter(o => sh && o.shiftId === sh.id); }
    if (Inv.status !== 'all') list = list.filter(o => o.status === Inv.status);
    if (q) list = list.filter(o => String(o.no).includes(q) || (o.customer && ((o.customer.name || '').toLowerCase().includes(q) || (o.customer.phone || '').includes(q))) || (o.tableName || '').includes(q));
    return list.slice().reverse();
  },
  expList() {
    const [a, b] = Range.bounds(); let list = DB.expenses.filter(e => e.date >= a && e.date <= b);
    if (!Perm.can('allExpenses')) { const sh = Shift.current(); list = DB.expenses.filter(e => sh && e.shiftId === sh.id); }
    return list.slice().reverse();
  },
  period() { return Range.from === Range.to ? Range.from : `من ${Range.from} إلى ${Range.to}`; },
  menu(getSpec) {

    $('[data-ok]', w).onclick = () => { const n = $('[data-n]', w).value.trim() || 'الصالة'; ts.forEach(t => t.zone = n); Store.save(); Modal.close(); App.refresh(); };
    $('[data-del]', w).onclick = () => {
      if (ts.some(t => DB.open.some(o => o.tableId === t.id))) return toast('توجد طاولات في هذه المنطقة عليها طلبات مفتوحة', 'error');
      const ids = new Set(ts.map(t => t.id)); DB.tables = DB.tables.filter(t => !ids.has(t.id)); Store.save(); Modal.close(); App.refresh();
    };
  },
  editTable(id) {
    const t = DB.tables.find(x => x.id === id);
    const w = Modal.open(`<div class="grid grid-cols-2 gap-3"><div><label class="lbl">اسم / رقم الطاولة</label><input class="inp" value="${esc(t.name)}" data-n></div><div><label class="lbl">المنطقة</label><input class="inp" value="${esc(t.zone)}" data-z></div></div>
      <div class="flex gap-2 justify-between mt-5"><button class="btn-ghost text-rose-300" data-del><i class="fa-solid fa-trash"></i> حذف</button><div class="flex gap-2"><button class="btn-ghost" data-close>إلغاء</button><button class="btn-primary" data-ok>حفظ</button></div></div>`, { title: 'تعديل طاولة', icon: 'fa-chair', size: 'max-w-md' });
    $('[data-ok]', w).onclick = () => { t.name = $('[data-n]', w).value.trim() || t.name; t.zone = $('[data-z]', w).value.trim() || 'الصالة'; Store.save(); Modal.close(); App.refresh(); };
    $('[data-del]', w).onclick = () => {
      if (DB.open.some(o => o.tableId === id)) return toast('الطاولة عليها طلب مفتوح', 'error');
      DB.tables = DB.tables.filter(x => x.id !== id); Store.save(); Modal.close(); App.refresh();
    };
  },
  backup() {
    Store.saveNow();
    const d = new Date();
    downloadFile(`dalala-backup-${dayKey(d)}-${pad(d.getHours())}${pad(d.getMinutes())}.json`, JSON.stringify(DB), 'application/json');
    S().lastBackup = Date.now(); Store.save(); toast('تم تنزيل النسخة الاحتياطية', 'success');
  },
  async restore(inp) {
    const f = inp.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await readFileAs(f));
      if (!data.settings || !data.products) throw new Error('bad');
      if (!App.isAdmin() && !(await requireAdmin('استعادة نسخة احتياطية'))) return;
      if (!(await confirmBox('سيتم استبدال كل البيانات الحالية بالنسخة المختارة. متأكد؟', { danger: true, ok: 'استعادة' }))) return;
      await Backup.snapshot('restore');
      Store.data = data; Store.saveNow(); location.reload();
    } catch (e) { toast('ملف غير صالح', 'error'); }
  },
  async restoreAuto(name) {
    if (!App.isAdmin() && !(await requireAdmin('استعادة نسخة احتياطية'))) return;
    let data; try { data = JSON.parse(await window.dalalaBackup.read(name)); if (!data.settings || !data.products) throw 0; } catch (e) { return toast('تعذرت قراءة النسخة', 'error'); }
    if (!(await confirmBox(`سيتم استبدال كل البيانات الحالية بنسخة <b>${esc(Backup.label(name))}</b>. تُحفظ نسخة من الوضع الحالي أولاً. متأكد؟`, { danger: true, ok: 'استعادة' }))) return;
    await Backup.snapshot('restore'); Store.data = data; Store.saveNow(); location.reload();
  },
  async clearSales() {
    if (!App.isAdmin() && !(await requireAdmin('مسح المبيعات'))) return;
    if (!(await confirmBox('سيتم حذف كل الفواتير والورديات والمصروفات والطلبات المفتوحة مع الإبقاء على الأصناف والإعدادات. ننصح بأخذ نسخة احتياطية أولاً.', { danger: true, ok: 'مسح المبيعات' }))) return;
    await Backup.snapshot('clear');
    Object.assign(DB, { orders: [], shifts: [], expenses: [], open: [], tickets: [], log: [] }); Store.saveNow(); location.reload();
  },
  async reset() {
    if (!App.isAdmin() && !(await requireAdmin('ضبط المصنع'))) return;
    if (!(await confirmBox('سيتم حذف كل البيانات وإرجاع المنظومة لحالتها الأولى!', { danger: true, ok: 'نعم، احذف كل شيء' }))) return;
    if (!(await confirmBox('تأكيد أخير: لا يمكن التراجع عن هذه العملية.', { danger: true, ok: 'حذف نهائي' }))) return;
    await Backup.snapshot('reset');
    Store.data = defaultData(); Store.saveNow(); location.reload();
  }
};

/* 06-print.js */
/* =====================================================================
   Printing: customer receipt, kitchen ticket, shift & sales reports
   ===================================================================== */
const Printer = {
  css(paper) {
    const w = paper === 210 ? '190mm' : '100%';
    return `@page{size:${paper === 210 ? 'A4' : paper + 'mm auto'};margin:${paper === 210 ? '12mm' : '0'}}
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;color:#000;background:#fff;width:${w};margin:0 auto;padding:${paper === 210 ? '0' : '3mm ' + (paper === 58 ? '2mm' : '3.5mm')};overflow-wrap:anywhere;font-size:${paper === 58 ? '11px' : '12px'};line-height:1.45}
      .c{text-align:center}.b{font-weight:bold}.big{font-size:1.5em}.xl{font-size:2.2em}.ono{border:3px solid #000;border-radius:6px;padding:3px 4px;margin:5px 0;text-align:center;line-height:1.1}.ono .lbl{font-size:1em;font-weight:bold}.ono .num{font-size:${paper === 58 ? '56px' : paper === 210 ? '64px' : '76px'};font-weight:900;line-height:1.05;letter-spacing:1px}.ono .sub{font-size:1.15em;font-weight:bold;margin-top:2px}.sm{font-size:.85em}
      .hr{border-top:1px dashed #000;margin:5px 0}.hr2{border-top:2px solid #000;margin:5px 0}
      table{width:100%;border-collapse:collapse}.ttl{font-size:1.67em;font-weight:bold;text-align:center}.sum{font-size:1.1em;font-weight:bold}.rt{table-layout:fixed}.rt th,.rt td{border:1px solid #000;padding:3px 4px;vertical-align:middle;text-align:center}.rt td.n{text-align:right}.rt th{font-size:1.1em;font-weight:bold}td,th{padding:2px 1px;vertical-align:top}th{border-bottom:1px solid #000;font-size:.9em;text-align:right}
      .l{text-align:left}.row{display:flex;justify-content:space-between;gap:6px}.row>span{min-width:0}html{width:100%}
      .box{border:2px solid #000;padding:4px;margin:4px 0;text-align:center}
      .page{page-break-after:always}.page:last-child{page-break-after:auto}
      img.logo{max-width:40%;max-height:22mm;display:block;margin:0 auto 4px}`;
  },
  doc(body, paper) { return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>${this.css(paper)}</style></head><body>${body}</body></html>`; },

  print(body, { kitchen = false, copies = 1, paper: pp } = {}) {
    const s = S(), paper = pp || s.paper;
    copies = Math.max(1, Math.min(5, parseInt(copies) || 1));
    const dialog = () => {
      const html = this.doc(Array.from({ length: copies }, () => `<div class="page">${body}</div>`).join(''), paper);
      // طابور: لا تبدأ الطباعة التالية قبل انتهاء السابقة (فاتورة الزبون ثم تذكرة المطبخ على نفس الطابعة)
      const job = () => new Promise(done => {
        const f = $('#printFrame');
        let fin = false;
        const end = () => { if (fin) return; fin = true; setTimeout(() => { window.focus(); const t = Modal.top(), a = t && $('[autofocus]', t); if (a) a.focus(); else if (document.activeElement) document.activeElement.blur(); done(); }, 300); };
        f.onload = () => {
          f.onload = null;
          try { f.contentWindow.onafterprint = end; f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { console.error(e); end(); return; }
          setTimeout(end, 120000);   // ننتظر إغلاق نافذة الطباعة (afterprint) حتى لا تُلغي الطباعةُ التاليةُ الحاليةَ
        };
        f.srcdoc = html;
      });
      Printer._q = (Printer._q || Promise.resolve()).then(job, job);
    };
    if (PRN() && s.silentPrint) {
      const html = this.doc(body, paper);
      PRN().print(html, { silent: true, deviceName: (kitchen && s.kitchenPrinter) || s.printerName || '', copies, paper })
        .then(r => { if (r && r.ok === false) toast('تعذرت الطباعة المباشرة: ' + (r.error || 'تحقق من الطابعة') + ' — راجع اسم الطابعة في الإعدادات', 'error'); })
        .catch(e => toast('تعذرت الطباعة المباشرة: ' + ((e && e.message) || e || 'خطأ غير معروف'), 'error'));
      return;
    }
    dialog();
  },

  header() {
    const s = S();
    return `${s.logo ? `<img class="logo" src="${s.logo}">` : ''}<div class="ttl">${esc(s.name)}</div>
      ${s.address ? `<div class="c sm">${esc(s.address)}</div>` : ''}${s.phone ? `<div class="c sm">هاتف: ${esc(s.phone)}</div>` : ''}`;
  },

  receipt(o) {
    const s = S();
    const typeLine = isQuick() && o.type === 'take' ? 'بيع مباشر' : o.type === 'dine' ? `صالة — طاولة ${esc(o.tableName || tableName(o.tableId))}` : TYPES[o.type].name;
    const r = (k, v, cls = '') => `<div class="row ${cls}"><span>${k}</span><span>${v}</span></div>`;
    const body = `${this.header()}<div class="hr"></div>
      ${o.copy ? '<div class="c b sm">— نسخة —</div>' : ''}
      ${o.status && o.status !== 'paid' ? '<div class="box b">ملغاة</div>' : ''}
      ${o.dailyNo ? `<div class="ono"><div class="lbl">رقم الطلب</div><div class="num">${o.dailyNo}</div><div class="sub">${typeLine}</div></div>` : ''}
      ${r('فاتورة رقم: <b>' + o.no + '</b>', fmtDT(o.date))}
      ${o.dailyNo ? '' : r('النوع: <b>' + typeLine + '</b>', '')}
      ${r('الكاشير: ' + esc(o.userName || ''), '')}
      ${o.customer && (o.customer.name || o.customer.phone) ? `<div class="hr"></div>${o.customer.name ? r('الزبون:', esc(o.customer.name)) : ''}${o.customer.phone ? r('الهاتف:', esc(o.customer.phone)) : ''}${o.customer.address ? `<div>العنوان: ${esc(o.customer.address)}</div>` : ''}` : ''}
      <div class="hr"></div>
      <table class="rt"><colgroup><col style="width:31%"><col style="width:18%"><col style="width:24%"><col style="width:27%"></colgroup><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>القيمة</th></tr></thead><tbody>
      ${o.items.map(i => `<tr><td class="n">${esc(i.name)}${i.note ? `<div class="sm">(${esc(i.note)})</div>` : ''}</td><td>${i.qty}</td><td>${money(i.price, false)}</td><td>${money(i.price * i.qty, false)}</td></tr>`).join('')}
      </tbody></table><div class="hr"></div>
      ${r('المجموع:', money(o.subtotal))}
      ${o.discountAmt ? r('الخصم' + (o.discount && o.discount.type === 'pct' ? ` (${o.discount.value}%)` : '') + ':', money(o.discountAmt)) : ''}
      ${o.service ? r(`الخدمة (${s.serviceRate}%):`, money(o.service)) : ''}
      ${o.tax ? r(`الضريبة (${s.taxRate}%):`, money(o.tax)) : ''}
      ${o.delivery ? r('رسوم التوصيل:', money(o.delivery)) : ''}
      <div class="hr2"></div>${r('<b class="sum">الإجمالي:</b>', '<b class="sum">' + money(o.total) + '</b>')}<div class="hr2"></div>
      ${!o.pre ? `${o.pay.cash ? r('نقدي:', money(o.tendered || o.pay.cash)) : ''}${o.pay.card ? r('بطاقة:', money(o.pay.card)) : ''}${o.change ? r('الباقي:', money(o.change)) : ''}` : ''}
      ${o.note ? `<div class="hr"></div><div class="sm">ملاحظة: ${esc(o.note)}</div>` : ''}
      <div class="hr"></div><div class="c sum">${esc(s.footer)}</div><div class="c sm" style="margin-top:4px">منظومة دلالة</div>`;
    this.print(body, { copies: o.pre ? 1 : s.receiptCopies });
  },

  kitchen(t) {
    if (!t) return;
    const body = `<div class="c b">— تذكرة المطبخ —</div>
      ${t.dailyNo ? `<div class="ono"><div class="lbl">رقم الطلب</div><div class="num">${t.dailyNo}</div><div class="sub">${esc(t.label)}</div></div>` : `<div class="box"><div class="xl b">${esc(t.label)}</div></div>`}
      <div class="row sm"><span>${fmtDT(t.at)}</span><span>${esc(t.user || '')}</span></div><div class="hr2"></div>
      <table><tbody>${t.items.map(i => `<tr><td class="b big" style="width:18%">${i.qty} ×</td><td class="b big">${esc(i.name)}${i.note ? `<div style="font-size:.75em">» ${esc(i.note)}</div>` : ''}</td></tr>`).join('')}</tbody></table>
      ${t.note ? `<div class="hr"></div><div class="b">ملاحظة: ${esc(t.note)}</div>` : ''}<div class="hr2"></div>`;
    this.print(body, { kitchen: true, copies: S().kitchenCopies });
  },

  shiftReport(sh) {
    if (!sh) return;
    const s = sh.summary || Shift.summary(sh);
    const r = (k, v) => `<div class="row"><span>${k}</span><b>${v}</b></div>`;
    const body = `${this.header()}<div class="hr"></div><div class="c b big">تقرير إغلاق وردية (Z)</div><div class="c">وردية رقم ${sh.no}</div><div class="hr"></div>
      ${r('الكاشير:', esc(sh.userName))}${r('الفتح:', fmtDT(sh.openAt))}${r('الإغلاق:', sh.closeAt ? fmtDT(sh.closeAt) : 'مفتوحة')}
      <div class="hr"></div>${r('عدد الفواتير:', s.count)}${r('الملغاة:', s.voids)}${r('إجمالي المبيعات:', money(s.sales))}${r('الخصومات:', money(s.discount))}
      <div class="hr"></div>${r('مبيعات نقدية:', money(s.cash))}${r('مبيعات بطاقة:', money(s.card))}${r('رصيد افتتاحي:', money(sh.openCash))}${r('المصروفات:', money(s.exp))}
      <div class="hr2"></div>${r('النقد المتوقع:', money(sh.expected != null ? sh.expected : s.expected))}
      ${sh.closeCash != null ? r('النقد الفعلي:', money(sh.closeCash)) + r('الفرق:', money(sh.diff) + (sh.diff < 0 ? ' عجز' : sh.diff > 0 ? ' زيادة' : '')) : ''}
      ${sh.note ? `<div class="hr"></div><div>ملاحظات: ${esc(sh.note)}</div>` : ''}
      <div class="hr"></div><br><div class="row"><span>توقيع الكاشير: ..........</span></div><br><div class="row"><span>توقيع المدير: ..........</span></div>`;
    this.print(body);
  },

  salesReport() {
    const r = reportData();
    const row = (k, v) => `<div class="row"><span>${k}</span><b>${v}</b></div>`;
    const top = Object.entries(r.prod).sort((a, b) => b[1].total - a[1].total);
    const body = `${this.header()}<div class="hr"></div><div class="c b big">تقرير المبيعات</div><div class="c">من ${Range.from} إلى ${Range.to}</div><div class="hr"></div>
      ${row('عدد الفواتير:', r.count)}${row('إجمالي المبيعات:', money(r.sales))}${row('متوسط الفاتورة:', money(r.avg))}${row('الخصومات:', money(r.discount))}
      ${r.service ? row('الخدمة:', money(r.service)) : ''}${r.tax ? row('الضريبة:', money(r.tax)) : ''}${r.delivery ? row('التوصيل:', money(r.delivery)) : ''}
      <div class="hr"></div>${row('نقدي:', money(r.cash))}${row('بطاقة:', money(r.card))}${row('المصروفات:', money(r.expenses))}${row('المشتريات:', money(r.purchases))}${row('الملغاة:', r.voids.length)}
      ${row('صافي الربح (المبيعات − المشتريات − المصروفات):', money(r.net))}
      <div class="hr2"></div><div class="b">الأصناف المباعة</div>
      <table><thead><tr><th>الصنف</th><th class="c">كمية</th><th class="l">المبلغ</th></tr></thead><tbody>${top.map(([n, v]) => `<tr><td>${esc(n)}</td><td class="c">${v.qty}</td><td class="l">${money(v.total, false)}</td></tr>`).join('')}</tbody></table>
      <div class="hr"></div><div class="c sm">طُبع في ${fmtDT(Date.now())} بواسطة ${esc(App.user.name)}</div>`;
    this.print(body);
  },

  test() {
    this.print(`${this.header()}<div class="hr"></div><div class="c b big">طباعة تجريبية</div><div class="c">${fmtDT(Date.now())}</div><div class="hr"></div><div class="c">إذا ظهرت هذه الورقة بشكل سليم فالطابعة جاهزة ✓</div><div class="hr"></div>`);
  }
};
